far_eastern_volunteer_tt: "Будет §Gразвёрнута§! 2 §Yпехотные§! дивизии следующего состава:\n- 2 £GFX_unit_militia_icon_small батальона.\n\nБудет §Gразвёрнута§! 1 §Yкавалерийская§! дивизия следующего состава:\n- 2 £GFX_unit_irregular_cavalry_icon_small батальона."
FER_red_partisans: "Присутствие красных партизан"
FER_Scattered_Tips_from_the_Far_East: "Разрозненные Советы Дальнего Востока"
FER_Scattered_Tips_from_the_Far_East_desc: "Советская власть на Дальнем Востоке существует скорее как сеть местных Советов, комитетов и революционных органов, чем как единый государственный механизм. Огромные расстояния, слабая связь и постоянные споры между местными властями затрудняют проведение решений центра, мобилизацию ресурсов и даже обычное строительство."
FER_Amur_Military_Flotilla: "Амурская военная флотилия"
FER_Amur_Military_Flotilla_desc: "Амур остаётся одной из главных транспортных артерий Дальнего Востока, а вооружённые суда флотилии связывают удалённые гарнизоны и поддерживают сухопутные части. Канонерские лодки позволяют быстрее перебрасывать людей и припасы и прикрывать важнейшие переправы."
FER_Intervention_at_the_gate: "Интервенция у ворот"
FER_Intervention_at_the_gate_desc: "Японские войска высадились во Владивостоке, державы Антанты рассматривают Дальний Восток как поле для вмешательства, а положение советской власти остаётся непризнанным и шатким. За пределами Советской России у Дальсовнаркома почти нет тех, кому он может доверять."
FER_Amur_Military_Flotilla: "Амурская военная флотилия"
FER_Amur_Military_Flotilla_desc: "Амур остаётся одной из главных транспортных артерий Дальнего Востока, а вооружённые суда флотилии связывают удалённые гарнизоны и поддерживают сухопутные части. Канонерские лодки позволяют быстрее перебрасывать людей и припасы и прикрывать важнейшие переправы."


 