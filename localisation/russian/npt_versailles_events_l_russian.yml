l_russian:
 
 SER_CRO_ethnic_separatism: "Этнический сепаратизм хорватов и словенцев"
 AUH_CRO_separatists: "Народные организации сербов, хорватов и словенцев"
 AUH_CRO_separatists_desc: "«Югославский клуб» политиков Рейхсрата пробудил активность низовых партийных ячеек славянских политиков в Империи. Теперь по всей Хорватии и Словении растёт количество местных политических комитетов, которые постепенно перехватывают управление."
 
 yugoslavian_angry_in_AUH.1.t: "Декларация югославского клуба"
 yugoslavian_angry_in_AUH.1.desc: "Декларация об объединении славянских земель на юге Империи представлена сегодня в Рейхсрате. Основная её мысль создание самоуправляемой административной единицы на территории со словенским, хорватским и сербским населением при сохранении унии с домом Габсбургов и нахождении в едином государстве. Фактически предложение заключается в превращении дуалистической монархии в тройственную, где наравне с Австрией и королевством Венгрия появится новое Сербо-Хорватское королевство.\nАвторы декларации — кружок депутатов известных как «Югославский клуб». Его главой является Антон Крошец, лидер словенской народной партии. Представитель Хорватского Собора Антре Павелич также высказался в поддержку декларации. Против «югославов» выступают бошняки и некоторые венгерские политики. В любом случае у нас нет необходимости как то реагировать прямо сейчас, хотя спокойствие поколеблено."
 yugoslavian_angry_in_AUH.1.a: "Мы подумаем над этим"
 yugoslavian_angry_in_AUH.1.b: "Необходимо запретить распространение декларации"
 
 yugoslavian_angry_in_AUH.2.t: "Реакция на австрийскую декларацию"
 yugoslavian_angry_in_AUH.2.desc: "Славянские депутаты австрийского Рейхсрата на днях вынесли декларацию, в которой призвали правительство Империи к проведению внутренней реформы и созданию автономного югославянского королевства. Хотя во многом этот документ отвечает нашим намерениям по освобождению сербских братьев в Австро-Венгрии, одновременно он является предохранителем призванным сохранить единство Габсбургского государства.\nНа данном этапе авторы декларации, так называемый «Югославский клуб», всё ещё надеются поменять статус своих земель внутри монархии без отделения и революционных потрясений. Представители нашего правительства уже готовят собственную декларацию, однако, предварительно необходимы консультации с участниками лондонского Югославского комитета."
 yugoslavian_angry_in_AUH.2.a: "Нельзя потерять инициативу в объединении славян"
 
 
 yugoslavian_angry_in_AUH.3.t: "Подготовка Корфской декларации"
 yugoslavian_angry_in_AUH.3.desc: "После провозглашения в австрийском Рейхсрате резолюции «югославского клуба» стало очевидно, что вопрос послевоенного устройства сербо-хорватских земель в Габсбургской монархии нельзя пускать на самотёк. В противном случае его перехватят местные имперские политики-«югославы». Для противодействия этим течениям правительством Сербии решено провести переговоры с Югославским комитетом в Риме.\nОднако до сих пор наши позиции серьезно расходились. Югославский комитет, составленный из бывших австро-венгерских политиков славянского происхождения, которые примкнули к Антанте в первые годы войны, выступает за создание федеративного государства. Позиция Николы Пашича, а вслед за ним и сербского правительства, заключается в планомерном построении Великой Сербии с безусловной сербской доминацией.\nВ этой обстановке обе стороны вынуждены учитывать агрессивные претензии Италии на Далмацию. Перед лицом одной из Великих держав югославы необходимо вынуждены проявить сплоченность, но противопоставить одной силе можно только другую, равную. Пашичу необходимо продемонстировать поддержку Петербурга (если это ещё возможно), иначе Югославский комитет резолюцию «Великой Сербии» не подпишет."
 yugoslavian_angry_in_AUH.3.a: "Россия поддержит претензии Великой Сербии"
 yugoslavian_angry_in_AUH.3.b: "Сейчас возможен лишь компромисс"
 yugoslavian_angry_in_AUH.3.c: "Сербы обойдутся без «комитетов»"
 
 yugoslavian_angry_in_AUH.4.t: "Давление на ГСХС"
 yugoslavian_angry_in_AUH.4.desc: "Война с Австрией завершилась нашей победой. Земли южных славян теперь свободны. Однако в Загребе уже возникло новое правительство — [CRO.GetNameDef]. По сути это группа политиков-славян бывшей Габсбургской монархии. Сейчас в соответствии с положениями Корфской декларации настал момент для полного объединения южных славян под предводительством сербской нации, и «югославы» должны это признать."
 yugoslavian_angry_in_AUH.4.a: "Загреб должен подчиниться"
 
 yugoslavian_angry_in_AUH.5.t: "Требования сербов"
 yugoslavian_angry_in_AUH.5.desc: "Сербское правительство выдвинуло требование о вхождении наших земель с состав «Великой Сербии» на основе положений Корфской декларации. Откровенно говоря заключенный под давлением со стороны сербских националистов и России документ по мнению многих наших политиков дискриминирует хорватов и словенцев. Вместо равноправного представительства и федерализма нам предлагается просто войти в состав Сербии и признать себя сербами. Тем не менее, в случае отказа единство хорватских и словенских земель окажется под вопросом — с одной стороны Италия способно продолжить интервенцию и забрать часть территорий нашего непризнанного правительства, с другой — сербское правительство открыто заявляет, что в случае отказа они ограничатся присвоением чисто сербских территорий, оставив Загреб без всякой дипломатической и военной помощи."
 yugoslavian_angry_in_AUH.5.a: "У нас нет выхода"
 yugoslavian_angry_in_AUH.5.b: "Эти условия неприемлемы, договора не будет"
 
 yugoslavian_angry_in_AUH.6.t: "Отказ Загреба"
 yugoslavian_angry_in_AUH.6.desc: "Правительство ГСХС в Загребе отказалось от вхождения в состав Сербии. Такое решение означает одновременно две вещи: первое — Корфская декларация de facto нарушена, второе — сербские войска продолжат наступление. Этнически сербские территории вернуться в единое государство."
 yugoslavian_angry_in_AUH.6.a: "Вперёд, в Боснию"
 
 yugoslavian_angry_in_AUH.7.t: "Подтверждение Корфской декларации"
 yugoslavian_angry_in_AUH.7.desc: "После падения Австро-Венгрии в Загребе сформировано новое правительство из представителей местных славянских партий. Ранее мы смогли заключить Корфскую декларацию с представителями Югославского комитета в Риме, а теперь она должна стать основной для объединения двух правительств. Необходимо установить связь с представителями ГСХС."
 yugoslavian_angry_in_AUH.7.a: "Пришло время объединяться"
 
 yugoslavian_angry_in_AUH.8.t: "Вопрос объединения"
 yugoslavian_angry_in_AUH.8.desc: "Не секрет что наше временное правительство находится под угрозой со стороны Италии и единственным гарантом сохранения единства хорватских и словенских земель является Сербия. В тоже время у Югославского комитета, который во время войны заседал в Риме, есть договор — так называемая Корфская декларация, по которой предусмотрено объединение югославянских земель под руководством Сербии на условиях создания нового государства с национальным паритетом. По сути, это единственный справедливый выход из ситуации без потери территорий."
 yugoslavian_angry_in_AUH.8.a: "Главное чтоб не стало хуже"
 
 yugoslavian_angry_in_AUH.9.t: "Продолжить наступление"
 yugoslavian_angry_in_AUH.9.desc: "Сербия одержала победу, но это ещё не всё. Территории с сербским населением, такие как Босния и Банат, всё ещё находятся под властью враждебных сил. В Загребе сформировано новое правительство, представляющее местное славянское население. Однако его лидеры — это либо политики Австро-Венгрии, либо участники различных комитетов. Мы не признаём это правительство и не пойдём с ним на соглашение. Наступление на север продолжается."
 yugoslavian_angry_in_AUH.9.a: "Вперёд, на Загреб"
 
 yugoslavian_angry_in_AUH.11.t: "Загребская резолюция"
 yugoslavian_angry_in_AUH.11.desc: "На днях в Загребе состоялась конференция участников «югославянских» партий. Главной её целью было укрепление взаимодействия политических сил южных славян Империи по программе Югославского клуба. На второй день встречи участники конференции приняли «Загребскую резолюцию».\nВ её преамбуле говорится, что словенцы, хорваты и сербы едины и что это единство должно оставаться неделимым и безусловным. Резолюция ссылается на право на самоопределение и призывала к международным гарантиям соблюдения этого права. В первом пункте резолюции содержится требование независимости, объединения и свободы в едином национальном государстве, где будут сохранены особенности словенцев, хорватов и сербов. В резолюции эти три народа упомянуты как «три племени одного народа».\nВо втором пункте резолюции находится требование о передаче «всей территории, на которой непрерывно проживает народ», без дополнительных уточнений, за исключением того, что территория включает берега, порты и острова северной и восточной частей Адриатического моря. В пункте также предполагаются гарантии культурной автономии для меньшинств. В резолюции не упомянута Австро-Венгрия как заранее определённая основа для создания требуемого государства или Габсбурги как его правители.\nТретий пункт Загребской резолюции призывает к созданию государства, основанного на принципах полной гражданской свободы и демократического самоуправления, правового и социального равенства, обеспечивающего экономическое процветание и всестороннее культурное и социальное развитие всех граждан. Четвёртый и последний пункт резолюции требует гарантировать словенцам, хорватам и сербам участие в будущей мирной конференции.\nНаконец, депутатами назначен комитет, которому поручено создать Национальный совет словенцев, хорватов и сербов, и назначена следующая конференция в Загребе."
 yugoslavian_angry_in_AUH.11.a: "«Югославский клуб» действует всё решительней"
 
 news_auh.1.t: "Югославская декларация в Рейхсрате"
 news_auh.1.desc: "В Австрийском парламенте Цислейтании группа югославянских депутатов внесла декларацию о создании собственной автономной единицы. 30 представителей Рейхсрата, а также представители внутренних словенских и хорватских партий поддержали данное заявление, адресованное правительству Империи и Габсбургскому дому.\n\nВряд ли Австро-Венгрия будет реформирована во время войны, тем не менее, теперь сербское правительство и Югославский комитет получили альтернативу своим послевоенным планам как по созданию Великой Сербии, так и по объединению хорват и сербов вне рамок Империи."
 news_auh.1.a: "Разобраться в ситуации очень сложно"
 
 news_auh.2.t: "Декларация Великой Сербии"
 news_auh.2.desc: "Сербское правительство и Югославский комитет выпустили декларацию по итогам переговоров прошедших на острове Корфу. В декларации сообщается о необходимости бороться за Великую Сербию и добиваться её создания после поражения Австро-Венгерской монархии.\n\nДекларация утверждает наличие триединого народа сербов-хорватов-словенцев. Эта общность выделена на основе единого, как считают сербы, языка. Несмотря на такую концепцию, главную роль в новом государстве будут играть сербы и династия Карагеоргиевичей. Такое решение оказалось возможным только благодаря сохранению протекции царской России. В свою очередь члены Югославского комитета по некоторым сведением оказались недовольны итогом, но вынуждены идти на уступки перед лицом угрозы итальянской оккупации Далмации."
 news_auh.2.a: "Разобраться в ситуации очень сложно"
 
 news_auh.3.t: "Корфская декларация"
 news_auh.3.desc: "Сербское правительство и Югославский комитет подписали соглашение. Суть документа в декларации поддержки идеи создания единого югославского государства после поражения Австро-Венгрии. Новое государство должно получить название Королевство Сербов Хорватов и Словенцев. Все три народности признаются частями единого народа. Сербы получают большинство, а их король станет единым монархом при конституционном строе.\n\nНесмотря на ряд подобных смелых заявлений, многие «югославы» скептически оценивают возможность объединения с Сербией из-за великосербских настроений среди военных и правительственных кругов этой страны. В то же время Италия настороженно следит за действиями союзников и одновременно конкурентов в борьбе за побережье Далмации."
 news_auh.3.a: "Разобраться в ситуации очень сложно"
 
 
 petrograd_war_conference_Entente.1.t: "Петроградская конференция"
 petrograd_war_conference_Entente.1.desc: "В Петрограде открыта конференция союзных держав. Среди представителей Антанты: от Британии - член кабинета министров и военного совета Мильнер, посол Бьюкенен, полномочный министр Ревельсток и генерал Вильсон; от Французской республики - министр колоний Думерг, посол в Петрограде Палеолог и генерал Кастельно; от Италии - член правительства сенатор Шалойя, посол Карлотти ди Рипабелла и генерал Руджери-Ладерки; от Румынии - председатель совета министров Братиано.\n\nИностранных представителей в Александровском дворце в Царском селе встретил лично император Николай II. От России на конференцию были назначены Великий князя Сергей Михайлович, генерал Гурко, адмирал Русина, а также Сазонов и Нератов. Председателем конференции стал глава Российского МИД Покровский.\n\nНа конференции планируется обсудить вопросы ведения кампании 1917-го года, финансирования российской армии, а также послевоенного устройства Европы.\n\nИзначально ожидалось прибытие премьер-министров Британии и Франции, однако, при подготовке конференции, с ноября 1916 года лидеры союзных держав нашли повод послать вместо себя иных представителей."
 petrograd_war_conference_Entente.1.a: "Нам есть что обсудить!"
 petrograd_war_conference_Entente.2.t: "Наша позиция на конференции"
 petrograd_war_conference_Entente.2.desc: "На союзном форуме нас интересует прежде всего вопрос военного взаимодействия со странами Антанты. Не секрет что союзное командование планирует весной 1917-го года начать всеобщее наступление с целью парализовать Германию на всех фронтах и окончательно сломить её сопротивление. В целом наш штаб считает, что все необходимые ресурсы у нас уже накоплены, однако, участие в союзном наступлении имеет политический момент. Мы вполне можем уклониться от этого потребовав больше финансовой либо военной помощи. Поражение союзного наступления маловероятно, но если оно произойдет, то России лучше не иметь к этому отношения. Император напротив выражает полную уверенность в скорой победе."
 petrograd_war_conference_Entente.2.a: "Мы участвуем наравне со всеми"
 petrograd_war_conference_Entente.2.b: "Сначала помощь - потом наступление"
 petrograd_war_conference_Entente.2.c: "Оборонительная стратегия предпочтительна"
 petrograd_war_conference_Entente.3.t: "Россия готова наступать"
 petrograd_war_conference_Entente.3.desc: "Русские представители на конференции в Петрограде - генерал Гурко и великий князь Сергей Михайлович - заявили о полноценном участии России в общем весеннем наступлении стран Антанты. Тем не менее, с вопросом согласования сроков возникли проблемы. Изначальные расчеты на март отброшены, русские согласны двинуть свои армии с первого апреля по первое мая, учитывая что последняя дата является крайней."
 petrograd_war_conference_Entente.3.a: "Всеобщему наступлению быть!"
 petrograd_war_conference_Entente.4.t: "Россия требует поддержки"
 petrograd_war_conference_Entente.4.desc: "Русские представители на конференции в Петрограде - генерал Гурко и великий князь Сергей Михайлович - заявили о необходимости расширения военной поддержки царской армии со стороны союзных держав. В некотором роде это не было неожиданностью. Русские сейчас формируют новые пополнения и готовы полностью покрыть потери предыдущего года. Всё это требует огромных средств, однако, в преддверии всеобщего наступления каждая страна Антанты напрягает все силы и подобное обращение является не совсем корректным. Некоторые подозревают, что русская армия и вовсе небоеспособна."
 petrograd_war_conference_Entente.4.a: "Всё необходимое и так направлено в Россию!"
 petrograd_war_conference_Entente.4.b: "Программа помощи русским должна быть расширена"
 petrograd_war_conference_Entente.5.t: "Отказ в поддержке наступления"
 petrograd_war_conference_Entente.5.desc: "Несмотря на настойчивые требования наших представителей на конференции в Петрограде союзные державы отказались от увеличения объемов военной и финансовой помощи уже выделенных нашему правительству. Англичане отдельно заявили, что их грузы во многих случаях остаются неиспользованными, французы же упрекнули российскую армию в недостаточной эффективности при постоянном росте требований. Инцидент удалось замять, но теперь обе стороны переговоров сомневаются в полноценном участии России в новом наступлении."
 petrograd_war_conference_Entente.5.a: "Хороши союзнички!"
 petrograd_war_conference_Entente.6.t: "Союзная поддержка наступления"
 petrograd_war_conference_Entente.6.desc: "Генерал Гурко добился от представителей Антанты предоставления нам постоянной военной помощи. Поток грузов включающий в себя оружие, пушки, аэропланы, топливо и некоторые новые образцы вооружений должен быть направлен в Россию в ближайшее время. Если этому, конечно не помешают германские субмарины."
 petrograd_war_conference_Entente.6.a: "Может быть это нам поможет"
 petrograd_war_conference_Entente.7.t: "Русская армия останется на месте"
 petrograd_war_conference_Entente.7.desc: "Представители России на конференции в Петрограде отказались участвовать в планируемом весной всеобщем наступлении. Русские генералы ссылаются на хорошее состояние германской армии и плохую поддержку со стороны союзников. Такое поведение России явно усложняет взаимодействие в рамках Антанты и что с этим делать пока не ясно."
 petrograd_war_conference_Entente.7.a: "А зачем приглашали?"
 petrograd_war_conference_Entente.8.t: "Секретный договор с Россией"
 petrograd_war_conference_Entente.8.desc: "В рамках союзной конференции в Петрограде наш представитель Думерг рассматривает возможность предложить русским взаимные тайные обязательства по устройству послевоенной Европы. Мы намерены взаимно поддерживать претензии друг друга, в частности, французские претензии на возвращение Эльзас-Лотарингии и отторжение Рейнании и русские претензии на Польшу и турецкие проливы. Помимо этого русские нацелены на территории Австро-Венгрии и считают необходимым создание чешского королевства под своим протекторатом. После войны такие действия очевидно вызовут недовольство Англии, однако, её в известность ставить необязательно."
 petrograd_war_conference_Entente.8.a: "Россия и Франция поделят Европу"
 petrograd_war_conference_Entente.8.b: "Всё решиться на послевоенных переговорах!"
 petrograd_war_conference_Entente.9.t: "Секретный договор с Францией"
 petrograd_war_conference_Entente.9.desc: "Французский министр Гастон Думерг находящийся в России по делам союзной конференции встретился с императором Николаем II. В ходе обсуждений царь высказал свои опасения по вмешательству в европейские дела США и вместе с тем выразил стремление к взаимной поддержке Франции и России в послевоенной ситуации. Контакт обнаруженный на этой почве привёл к согласованию секретного франко-русского договора, по которому Россия обязалась поддержать претензии союзницы на западные территории Германской империи включая Рейн, а Франция, в свою очередь, высказала намерения передать царю проливы и поддержать любые действия монархии в Польше и на восточных австрийских территориях, с Богемией включительно."
 petrograd_war_conference_Entente.9.a: "Победа обеспечена"
 
 petrograd_war_conference_Entente.11.t: "Направление войск в Чехию"
 petrograd_war_conference_Entente.11.desc: "После развала Габсбургской монархии из её состава стали выпадать значительные славянские территории - одна из них Чехословакия. Сейчас новое государство находится в периоде становления, чехи вполне готовы принять любую союзную волю касательно своего статуса, при этом, Россия и Франция уже давно договорились о взаимной поддержке претензий в послевоенной Европе. Сейчас ничего не мешает нам ввести в Чехию войска под союзными флагами дабы оградить её от любых посягательств со стороны немцев и мадьяр."
 petrograd_war_conference_Entente.11.a: "Прага - встречай!"
 petrograd_war_conference_Entente.11.b: "Всё решиться на переговорах"
 petrograd_war_conference_Entente.12.t: "Русская армия в Чехии"
 petrograd_war_conference_Entente.12.desc: "После падения власти Габсбургов чехи впервые приветствуют на своих улицах союзную русскую армию! Годами русские сражались за свободу славянства и теперь весь народ ликует при виде своих освободителей. У молодой Чехии ещё много угроз вокруг, немцы и мадьяры отнюдь не угомонились. При этом, русская армия пришла не совсем бескорыстно. Русские намерены выдвинуть свои условия новому чешскому правительству. Учитывая, что они действует при поддержки Франции на данный момент противостоять им нет смысла."
 petrograd_war_conference_Entente.12.a: "Теперь Россия наш первый союзник!"
 
 petrograd_war_conference_Entente.13.t: "Царство Чешское и Словацкое"
 petrograd_war_conference_Entente.13.desc: "Тем не менее, появление под боком трёхсотлетнего дома Романовых славянской республики одобрено быть не может. У нас свои планы на определение лучшего государственного строя для чешского народа - тем более, что установление своей монархии вполне предотвратит притязания немцев и мадьяр на чуждое славянству восстановление богемской короны. Наконец, идея республики находит отклик разве что среди черни, тогда как благородные слои разночинной интеллигенции и дворянства стоят за монархию - только спорят о том, конституционная она будет или же полноценная."
 petrograd_war_conference_Entente.13.a: "Направим туда Дмитрия"
 petrograd_war_conference_Entente.13.b: "Направим туда Михаила"
 
 petrograd_war_conference_Entente.14.t: "Смена флагов"
 petrograd_war_conference_Entente.14.desc: "Наши русские братья не стерпели появления республики под боком у трёхсотлетнего дома Романовых, потому решили поддержать монархические круги - в конце концов, действительно популярной республика была только у узкой прослойки радикалов, да черни, ничего не понимающей в государственном строительстве. К тому же, это позволит вполне предотвратит притязания немцев и мадьяр на чуждое славянству восстановление богемской короны."
 petrograd_war_conference_Entente.14.a: "Боже, царя храни!"
 petrograd_war_conference_Entente_14_a_tt: "Вся популярность идеологий §YКонсерватизм§! ([?party_popularity@conservatism|%G0]), §YПатернализм§! ([?party_popularity@despotism|%G0]) и §YФашизм§! ([?party_popularity@fascism|%G0]) перейдёт идеологии §YАвторитаризм§!.\n"
 
 
 
 secret_diplomacy_Entente.1.t: "Сообщения о соглашении союзников"
 secret_diplomacy_Entente.1.desc: "В Петрограде новыми властями в лице партии большевиков опубликованы документы тайной дипломатии Антанты. По этим сведениям, перепечатанным в том числе газетами в Лондоне, Британия, Франция и царская Россия, намерены были разделить нашу империю на несколько частей с отторжением востока в пользу русских, сирийского побережья в пользу французов, и Ирак с Иорданией в пользу англичан.\n\nВ подлинности документов не приходится сомневаться, и теперь многие сторонники мира с Антантой оказались посрамлены, их влияние будет подорвано, в то время как сила сторонников прогерманского крыла вновь возросла.\n\nВ тоже время, арабы, восставшие против империи под руководством шейха Фейсала, оказались в неоднозначном положении. Фактически англо-французы разделили не только наши территории, но и те земли, на которые претендуют мятежники. Получается, что Антанта их обманула."
 secret_diplomacy_Entente.1.a: "Теперь ясно, чего хочет Антанта!"
 secret_diplomacy_Entente.2.t: "Истинные цели Антанты"
 secret_diplomacy_Entente.2.desc: "В международной прессе опубликованы части англо-французского договора по разделу Турции. В области которые намерены оккупировать обе страны входят также земли с арабским населением, и более того, это именно те территории, которые обещаны нам для создания единого арабского государства. Теперь известно, что все эти обещания не более чем лживые посулы представителей союзников. Так ли правильна война которую мы ведём?"
 secret_diplomacy_Entente.2.a: "Видимо, нас обманули"
 secret_diplomacy_Entente.2.b: "Пора заканчивать эту войну"
 secret_diplomacy_Entente.3.t: "Тайное послание арабских вождей"
 secret_diplomacy_Entente.3.desc: "Руководители арабского восстания в Хиджазе направили нам депешу с предложением прекратить взаимную вражду. Во имя Аллаха, милостивого и милосердного, они призывают забыть возникшие разногласия и вновь установить взаимовыгодные отношения. Причиной тому явно неудачно течение войны для англичан и их союзников, а также очевидный обман в арабо-британских отношениях, который был вскрыт публикацией договоров Сайкса-Пико. Сейчас арабы находятся в щепетильном положении, но если мы согласимся на мир, вполне возможно, что это позволит утихомирить националистические выступления в других регионах - Сирии и Месопотамии. С другой стороны, Хиджаз всё ещё наша провинция, и прописать её отделение невозможно, и если речь идёт о договоре, то лишь о некой промежуточной форме, например, восстановлении вассалитета."
 secret_diplomacy_Entente.3.a: "Восстание должно быть раздавлено"
 secret_diplomacy_Entente.3.b: "Предательство подданных будет прощено"
 secret_diplomacy_Entente.4.t: "Османы отвергли переговоры"
 secret_diplomacy_Entente.4.desc: "Представители Османской империи отказались вести с нами переговоры. По их мнению, арабские вожди Хиджаза предали Турцию и весь исламский мир, по отношению к предателям возможны только суд и жестокость."
 secret_diplomacy_Entente.4.a: "Мы один на один с турками"
 secret_diplomacy_Entente.5.t: "Наши претензии раскрыты"
 secret_diplomacy_Entente.5.desc: "Большевики осмелились опубликовать тайные договоры царской дипломатии. Среди архивов российского МИД они обнаружили ряд договоров по разделу Османской империи, из которых самым скандальным для нас стал договор Сайкса-Пико. Данный документ был согласован весной 1916 года и касался зон оккупации в Сирии, Ираке и на юге Анатолии. Фактически на весь мир объявлено, что Антанта готовится к самым грубым аннексиям. Берлин, должно быть, в восторге, в то время как наши союзники-арабы пытаются получить хоть какие-то разъяснения о произошедшей ситуации. И тут же внутренние критики обрушились на нас со всей силой, чтобы обвинить правящие круги в затягивании войны из аннексионистских стремлений."
 secret_diplomacy_Entente.5.a: "Когда-нибудь все бы узнали об этом"
 secret_diplomacy_Entente.6.t: "Декларация Бальфура"
 secret_diplomacy_Entente.6.desc: "Ещё в начале войны наше правительство рассматривало возможность создания независимого государства в Палестине со значительным еврейским большинством. В течении последующих лет состоялись ряд консультаций между представителями кабинета министров, армии, министерства иностранных дел, а также лидерами сионистских и еврейских организаций Великобритании. Последние в лице лорда Ротшильда и Хаим Вайцман подготовили собственные предложения. Теперь планируется направить им открытую телеграмму с указанием наших намерений по созданию нового дома для евреев. Этот жест поможет привлечь на нашу сторону сионистов всего мира, кроме того, так мы можем закрепить свои претензии на Палестину, однако, арабы могут быть недовольны."
 secret_diplomacy_Entente.6.a: "Наши намерения будут озвучены публично"
 secret_diplomacy_Entente.6.b: "Не стоит рисковать поддержкой арабов"
 secret_diplomacy_Entente.7.t: "Речь о мире"
 secret_diplomacy_Entente.7.desc: "После публикации большевиками в России декрета о мире и обращения ко всем воюющим странам, а также раскрытия содержания тайных соглашений Антанты, остро встал вопрос о предоставлении демократической альтернативы мирного соглашения. Сейчас большинство публичных ответов наших союзников выглядят либо невзрачно, либо неубедительно, именно поэтому президент Вудро Вильсон сформулировал собственные принципы послевоенного урегулирования, которые и представил в сегодняшней речи конгрессу.\n\nПредставленная публике модель Вильсона содержит всего 14 пунктов:\n1.  Завершение тайной дипломатии, только открытые договоры;\n2.  Абсолютная свобода судоходства на морях вне территориальных вод;\n3.  Равенство условий торговли для всех наций;\n4.  Сокращение вооружений;\n5.  Свободное, чистосердечное и абсолютно беспристрастное разрешение всех колониальных споров, с учетом мнения населения;\n6.  Освобождение всех русских территорий, невмешательство в выборы модели правления в России;\n7.  Освобождение Бельгии в статусе независимой державы;\n8.  Вся французская территория должна быть освобождена, зло причиненное Эльзасу должно быть исправлено;\n9.  Исправление границ Италии должно быть произведено на основе ясно различимых национальных границ;\n10. Народы Австро-Венгрии должны получить широчайшую автономию и возможность присутствия в Лиге Наций;\n11. Румыния, Сербия и Черногория должны быть освобождены;\n12. Суверенитет турецких частей Османской империи и автономия нетурецких частей; Свобода судоходства в Проливах;\n13. Создание независимого польского государства;\n14. Должно быть образовано общее объединение наций на основе особых статусов в целях создания взаимной гарантии политической независимости и территориальной целости как больших, так и малых государств."
 secret_diplomacy_Entente.7.desc_1: "Германская Империя успела несколько раз публично предложить условия переговоров или мира, таким образом немцы перетягивают на себя тогу миротворцев. Это недопустимо. Сейчас большинство публичных ответов наших союзников выглядят либо невзрачно, либо неубедительно, именно поэтому президент Вудро Вильсон сформулировал собственные принципы послевоенного урегулирования, которые и представил в сегодняшней речи конгрессу.\n\nПредставленная публике модель Вильсона содержит всего 14 пунктов:\n1.  Завершение тайной дипломатии, только открытые договоры;\n2.  Абсолютная свобода судоходства на морях вне территориальных вод;\n3.  Равенство условий торговли для всех наций;\n4.  Сокращение вооружений;\n5.  Свободное, чистосердечное и абсолютно беспристрастное разрешение всех колониальных споров, с учетом мнения населения;\n6.  Освобождение всех русских территорий, невмешательство в выборы модели правления в России;\n7.  Освобождение Бельгии в статусе независимой державы;\n8.  Вся французская территория должна быть освобождена, зло причиненное Эльзасу должно быть исправлено;\n9.  Исправление границ Италии должно быть произведено на основе ясно различимых национальных границ;\n10. Народы Австро-Венгрии должны получить широчайшую автономию и возможность присутствия в Лиге Наций;\n11. Румыния, Сербия и Черногория должны быть освобождены;\n12. Суверенитет турецких частей Османской империи и автономия нетурецких частей; Свобода судоходства в Проливах;\n13. Создание независимого польского государства;\n14. Должно быть образовано общее объединение наций на основе особых статусов в целях создания взаимной гарантии политической независимости и территориальной целости как больших, так и малых государств."
 secret_diplomacy_Entente.7.a: "Этот документ заложит основу мира!"
 secret_diplomacy_Entente.11.t: "Поездка за миром"
 secret_diplomacy_Entente.11.desc: "Мировая война завершена! США внесли решающий вклад в победу Антанты. Теперь наше дело в том, чтобы установить вечный мир в Европе и на всей земле. Его принципы уже были описаны в 14 пунктах Вильсона, именно на них и будет выстроена наша позиция на будущей мирной конференции. Пока в старом свете идут предварительные переговоры, президент намерен совершить поездку по столицам союзных стран."
 secret_diplomacy_Entente.11.a: "В первую очередь Париж!"
 
 secret_diplomacy_Entente.12.t: "Вопрос участия доминионов"
 secret_diplomacy_Entente.12.desc: "На предварительных переговорах Британия внесла предложение о предоставлении своим доминионам отдельных представительств с правом голоса. Некоторые видят в этом попытку Лондона заполучить больше мест на конференции и таким образом склонить весы в свою сторону, однако по другим сведениям речь идёт о желании самих членов Британской империи действовать самостоятельно от метрополии."
 secret_diplomacy_Entente.12.desc_1: "На предварительных переговорах наши дипломаты и представители доминионов проверили почву для предложения о предоставлении британским доминионам отдельных представительств с правом голоса. Решение не окончательное, потому что некоторые видят в этом попытку Лондона заполучить больше мест на конференции и таким образом склонить весы в свою сторону. Между тем и сами члены Британской империи не против получить больше самостоятельности от метрополии, и наша поддержка этих планов имеет как выгоды, так и риски."
 secret_diplomacy_Entente.12.a: "Доминионы получат право голоса"
 secret_diplomacy_Entente.12.b: "За доминионы говорить будет Англия"
 secret_diplomacy_Entente_12_tt_a: "Примет участие в конференции"
 secret_diplomacy_Entente_12_tt_b: "§YСила голоса§! английской делегации на последующих голосованиях повысится"
 
 secret_diplomacy_Entente.13.t: "Полноправное участие"
 secret_diplomacy_Entente.13.t_1: "Полноправное участие доминионов"
 secret_diplomacy_Entente.13.desc: "Наши представители в Европе добились нашего полноправного участия в грядущей мирной конференции. За время войны население доминионов понесло много жертв, и хотя у нас нет решающих голосов, всё-таки наше мнение будет услышано и повлияет на дальнейший миропорядок. При этом, нам вовсе не обязательно выражать своё согласие с действиями Лондонских властей."
 secret_diplomacy_Entente.13.desc_1: "Представители британских доминионов добились своего полноправного участия в грядущей мирной конференции. За время войны население доминионов понесло много жертв, и хотя им не предоставлено решающих голосов, всё-таки их мнение будет услышано и повлияет на дальнейший миропорядок. При этом, у них нет обязанности выражать своё согласие с действиями Лондонских властей."
 secret_diplomacy_Entente.13.a: "Мы это заслужили"
 european_peace_conference_dominions_patricipate: "Участие в европейской мирной конференции"
 secret_diplomacy_Entente.13.b: "Приветствуем страны-победительницы"
 
 secret_diplomacy_Entente.14.t: "Лондонская прерогатива"
 secret_diplomacy_Entente.14.desc: "Несмотря на усилия наших представителей в Европе, Лондон и союзники отказались от идеи полноправного участия заморских членов Британской Империи. Для нас это является грубым оскорблением: тысячи подданных короны из числа жителей доминионов сражались на полях Великой Войны, и теперь их право голоса забыто. Теперь наше правительство обдумывает ноту протеста и ряд действий по демонстрации независимости перед Лондоном."
 secret_diplomacy_Entente.14.desc_1: "Несмотря на усилия представителей доминионов, Лондон и союзники отказались от идеи полноправного участия заморских членов Британской Империи. В колониях многие сочли это грубым оскорблением: тысячи подданных короны из числа жителей доминионов сражались на полях Великой Войны, и теперь их право голоса забыто. Теперь их правительства обдумывают, как на это реагировать."
 secret_diplomacy_Entente.14.a: "Это повод бороться за новый статус!"
 european_peace_conference_dominions_not_participate_opinion: "Отстранение от мирной конференции"
 european_peace_conference_dominions_not_participate_strong: "Претензия против отстранения от европейской мирной конференции"
 secret_diplomacy_Entente.14.b: "Приветствуем страны-победительницы"
 european_peace_conference_dominions_not_patricipate: "Протест против отстранения от европейской мирной конференции"
 secret_diplomacy_Entente.14.c: "Пока что главенствовать будет Лондон"
 
 secret_diplomacy_Entente.15.t: "[FROM.GetNameDef] заявляет претензии"
 secret_diplomacy_Entente.15.desc: "После того, как мы совместно с союзниками отказали доминионам в полноправном участии в мирной конференции, местные представители заявили, что намерены бороться за более высокий статус своей части Империи. Конечно, об отделении речь пока не идёт, но в случае новой войны мы можем оказаться в изоляции."
 secret_diplomacy_Entente.15.a: "Это не к добру"
 
 secret_diplomacy_Entente.16.t: "[FROM.GetNameDef] заявляет претензии"
 secret_diplomacy_Entente.16.desc: "После того, как мы совместно с союзниками отказали доминионам в полноправном участии в мирной конференции, местные представители заявили свой протест. На единство Империи это не повлияет, но обстановка складывается нервная."
 secret_diplomacy_Entente.16.a: "Могло быть и хуже"
 
 secret_diplomacy_Entente.17.t: "Выбор места конференции"
 secret_diplomacy_Entente.17.desc: "Перед началом мирных переговоров важно определить, где именно будет проходить новая конференция. Выбор места немало подстегнёт престиж принимающей стороны и её правительства. Мы явно будем вынуждены принять их главные требования. Более того, город, в котором будет подписан мир, положивший конец всем войнам, войдёт в Историю."
 secret_diplomacy_Entente.17.a: "Париж"
 secret_diplomacy_Entente.17.b: "Лондон"
 secret_diplomacy_Entente.17.c: "Петроград"
 secret_diplomacy_Entente.17.d: "Рим"
 
 secret_diplomacy_Entente.18.t_paris: "Хозяин конференции - Париж"
 secret_diplomacy_Entente.18.desc_paris: "Столица Франции стала хозяином конференции. Неудивительно, ведь французский народ выдержал главные тяготы войны на самом главном фронте. Теперь странам-победительницам предстоит подготовить делегации к прибытию на конференцию, что займёт время."
 secret_diplomacy_Entente.18.t_london: "Хозяин конференции - Лондон"
 secret_diplomacy_Entente.18.desc_london: "Столица Британии стала хозяином конференции. Неудивительно, ведь именно мощь британской короны, откликнувшаяся на зов Европы о помощи, внесла один из решающих вкладов в победу. Теперь странам-победительницам предстоит подготовить делегации к прибытию на конференцию, что займёт время."
 secret_diplomacy_Entente.18.t_petrograd: "Хозяин конференции - Петроград"
 secret_diplomacy_Entente.18.desc_petrograd: "Столица России стала хозяином конференции. Неудивительно, ведь русская армия всю войну сковывала огромные силы германцев и австрийцев на протяжённом фронте, неся потери во имя выполнения союзнического долга. Теперь странам-победительницам предстоит подготовить делегации к прибытию на конференцию, что займёт время."
 secret_diplomacy_Entente.18.t_roma: "Хозяин конференции - Рим"
 secret_diplomacy_Entente.18.desc_roma: "Столица Италии стала хозяином конференции. Неудивительно, ведь это была общая победа, и вклад итальянского народа был таким, какой был ему по силам. Наконец, такое нейтральное решение не обидит другие державы, оспаривающие приз решающего вклада. Теперь странам-победительницам предстоит подготовить делегации к прибытию на конференцию, что займёт время."
 secret_diplomacy_Entente.18.a: "Ожидаем открытия"
 
 
 secret_diplomacy_Entente.19.t: "Вопрос российского представителя"
 secret_diplomacy_Entente.19.desc: "Во время войны Россия попала в полосу политической нестабильности. Николай II не смог удержать свою власть на должном уровне, вследствие чего в стране начались беспорядки, вызвавшие разложение армии. Некогда грозный восточный паровой каток превратился в груду развалин перед лицом германской военной машины. В итоге новое русское правительство поспешило заключить сепаратный мир в тот момент, когда Антанта была на пороге победы. Признавая заслуги России в первые годы борьбы с Германией и невозможность установить всеобщий мир без русских представителей, мы, тем не менее, не можем забыть предательство, совершённое Петроградом."
 secret_diplomacy_Entente.19.desc_1: "Во время войны Россия попала в полосу политической нестабильности. Николай II не смог удержать свою власть на должном уровне, вследствие чего в стране начались беспорядки, вызвавшие разложение армии. Некогда грозный восточный паровой каток превратился в груду развалин перед лицом германской военной машины. В итоге новое русское правительство поспешило заключить сепаратный мир в тот момент, когда Антанта была на пороге победы. Признавая заслуги России в первые годы борьбы с Германией и невозможность установить всеобщий мир без русских представителей, мы, тем не менее, не можем забыть предательство, совершённое Петроградом.\n\nК тому же, сейчас в России господствуют большевики. Они захватили центральные регионы и продолжают насаждать свою революцию, сопровождая это террором, отъёмом нашей собственности и запретом торговли. Признать данное правительство как законное будет крайне затруднительно с моральной и политической точки зрения. С другой стороны, в России против большевиков действует несколько группировок с проантантовской ориентацией. В случае их победы мы получим надежных союзников на востоке против возможного возрождения германского милитаризма. Возможно, в качестве законного представителя стоит выбрать кого-то из них."
 secret_diplomacy_Entente.19.desc_2: "Во время войны Россия попала в полосу политической нестабильности. Николай II не смог удержать свою власть на должном уровне, вследствие чего в стране начались беспорядки, вызвавшие разложение армии. Некогда грозный восточный паровой каток превратился в груду развалин перед лицом германской военной машины. В итоге новое русское правительство поспешило заключить сепаратный мир в тот момент, когда Антанта была на пороге победы. Признавая заслуги России в первые годы борьбы с Германией и невозможность установить всеобщий мир без русских представителей, мы, тем не менее, не можем забыть предательство, совершённое Петроградом.\n\nК тому же, сейчас в России господствуют большевики. Они захватили центральные регионы и продолжают насаждать свою революцию, сопровождая это террором, отъёмом нашей собственности и запретом торговли. Признать данное правительство как законное будет крайне затруднительно с моральной и политической точки зрения."
 secret_diplomacy_Entente.19.a: "В России сейчас не с кем разговаривать"
 secret_diplomacy_Entente.19.b: "Несмотря на предательство, мы должны учитывать русских"
 secret_diplomacy_Entente.19.c: "Нужно признать одно из правительств России"
 secret_diplomacy_Entente.19.d: "Мы можем поговорить и с большевиками"
 
 secret_diplomacy_Entente.21.t: "Россия без представительства"
 secret_diplomacy_Entente.21.desc: "По непрочным дипломатическим каналам до нас доходят известия, что страны-победительницы отказались от идеи привлечь представителей России к полноценному участию в мирной конференции. Лидеры Великих держав недовольны преждевременным выходом нашей страны из войны с Германией и к тому же считают, что в России отсутствует легальное правительство."
 secret_diplomacy_Entente.21.a: "Тем хуже для них"
 
 secret_diplomacy_Entente.22.t: "Выбор российского представителя"
 secret_diplomacy_Entente.22.desc: "Среди нескольких очагов сопротивления большевизму в бывшей Российской империи наибольшего нашего внимания заслуживают три направления: южное, северное и восточное. При прочих равных мы можем сделать ставку на поддержку каждого из них, но, пожалуй, только одно правительство может получиться наше одобрение в качестве всероссийского. Главное, чтобы этот выбор не стал преждевременным."
 secret_diplomacy_Entente_22_desc_NRR: "В Архангельске сейчас находится одно из наиболее лояльных Антанте правительств. Власть здесь возглавляют старые демократы, в том числе, из состава бывшего Временного правительства. Здесь же, уже присутствуют контингенты союзных войска, что даёт нам возможности для контроля местных лидеров, а также базу для операций против большевиков."
 secret_diplomacy_Entente.22.NRR: "Северное правительство более демократично"
 secret_diplomacy_Entente_22_desc_RVA: "На юге России закрепилась Добровольческая армия. Здесь собрались верхи бывшей царской армии, полностью лояльные интересам и целям Антанты в Европе. Лидеры добровольцев получили большую популярность у старого офицерства и как профессиональные военные имеют неплохие шансы на успех в вооружённой борьбе."
 secret_diplomacy_Entente.22.RVA: "Добровольческую армию ждёт военный успех"
 secret_diplomacy_Entente_22_desc_NVA: "Большого успеха добилась повстанческая армия Савинкова, освободившая Москву. Начав с подпольной работы и координации ячеек сопротивления (при содействии агентов Антанты), местные лидеры смогли устроить успешный мятеж и занять древнюю русскую столицу. Контроль Москвы играет крайне серьёзную роль в русских делах, так что многие уже готовы признать новое правительство главным для всей России."
 secret_diplomacy_Entente.22.NVA: "Люди Савинкова контролируют Москву. Это главное."
 secret_diplomacy_Entente_22_desc_NWA: "На данном этапе наши советники отмечают роль Северо-Западной белой армии. Это внушительная сила в развернувшейся в России гражданской войне. Опираясь на нашу помощь её лидеры смогли довести свои полки до Петрограда и отбить имперскую столицу из рук узурпаторов. Теперь северо-западная армия намерена идти на Москву. Большевики больше не контролируют центр России."
 secret_diplomacy_Entente.22.NWA: "Северо-Западная армия будет говорить из Петрограда"
 secret_diplomacy_Entente_22_desc_CCA: "Одним из главных претендентов на объединение всей России сейчас нужно признать Комитет членов Учредительного Собрания. Это правительство создано из участников Учредительного Собрания, которое было разогнано большевиками. Лидеры этого правительства - твёрдые демократы, и, в отличии от всех остальных, они действительно избраны народом."
 secret_diplomacy_Entente.22.CCA: "Комуч - единственный наследник Учредительного Собрания"
 secret_diplomacy_Entente_22_desc_CCA_mon: "Одним из главных претендентов на объединение всей России сейчас нужно признать [CCA.GetNameDef]. Это правительство пришло на смену разогнанному ими Комитету членов Учредительного Собрания и провозгласили восстановление старого дофевральского режима, однако они выказывают почтение ко всем союзническим обязательствам."
 secret_diplomacy_Entente.22.CCA_mon: "Монархисты с Поволжья будут верны обязательствам"
 secret_diplomacy_Entente_22_desc_RSS: "Основное признание среди самих русских имеет режим, созданный на востоке страны. Не так давно здесь прошло Государственное совещание, объединившее разрозненные местные правительства в одно, которое и получило наименование «Всероссийское». По мысли русских политиков, только объединение на равных началах способно возродить утраченную легитимность, и многие с этим согласны."
 secret_diplomacy_Entente.22.RSS: "Только Всероссийское правительство обеспечит единство"
 secret_diplomacy_Entente.22.no: "Никто из них не достоин представлять Россию"
 
 secret_diplomacy_Entente.24.t: "Приглашение на мирную конференцию"
 secret_diplomacy_Entente.24.desc: "Несмотря на противоречивую ситуацию внутри России и множество споров в лагере Антанты, Великие державы выразили согласие и надежду на присутствие нашего представителя на мирной конференции по случаю окончания Мировой войны. Этот жест, по сути, означает признание нас в качестве легитимного правительства России."
 secret_diplomacy_Entente.24.desc_1: "Несмотря на противоречивую ситуацию внутри России и множество споров в лагере Антанты, Великие державы выразили согласие и надежду на присутствие нашего представителя на мирной конференции по случаю окончания Мировой войны. Этот жест, по сути, означает признание нас в качестве легитимного правительства России."
 secret_diplomacy_Entente.24.a: "Европа одумалась"
 secret_diplomacy_Entente.24.b: "Мы не будем участвовать в империалистических разделах"
 secret_diplomacy_Entente.24.c: "Мы поедем, раз уж буржуи сами дают трибуну..."
 
 secret_diplomacy_Entente.26.t: "Приезд русской делегации"
 secret_diplomacy_Entente.26.t_1: "Приезд большевистской делегации"
 secret_diplomacy_Entente.26.desc_paris: "Великие державы всё же позволили русским прислать своего представителя, [FROM.GetNameDef] может радоваться этому международному признанию. Их дипломат с сопровождением только что прибыл в Париж и расположился в одном из отелей за счёт Антанты. Не вполне ясно, что будут требовать русские, но теперь они по крайней мере могут это заявить."
 secret_diplomacy_Entente.26.desc_london: "Великие державы всё же позволили русским прислать своего представителя, [FROM.GetNameDef] может радоваться этому международному признанию. Их дипломат с сопровождением только что прибыл в Лондон и расположился в одном из отелей за счёт Антанты. Не вполне ясно, что будут требовать русские, но теперь они по крайней мере могут это заявить."
 secret_diplomacy_Entente.26.desc_roma: "Великие державы всё же позволили русским прислать своего представителя, [FROM.GetNameDef] может радоваться этому международному признанию. Их дипломат с сопровождением только что прибыл в Лондон и расположился в одном из отелей за счёт Антанты. Не вполне ясно, что будут требовать русские, но теперь они по крайней мере могут это заявить."
