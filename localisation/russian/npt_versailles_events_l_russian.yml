 news_versailles.1.t: "Конференция в Петрограде"
 news_versailles.1.desc: "На днях представители Антанты прибыли в Петроград для обсуждения дальнейших усилий, направленных на победу в войне. В столице России сейчас находятся делегаты из Англии, Франции, Италии и Румынии. Они были приняты лично императором Николаем II, после чего провели встречи со многими видными политиками России.\n\nНесмотря на мирное предложение Германии, выдвинутое в декабре 1916 года, страны Антанты вовсе не намерены идти на условия Берлина, утверждая, что после трёх лет войны силы Центральных держав на исходе. По некоторым сведениям союзники готовят всеобщее наступление, которое завершит войну уже этим летом."
 news_versailles.1.a: "Антанта готовится к бою"
 news_versailles.2.t: "Русские в Праге"
 news_versailles.2.desc: "После развала Австро-Венгерской империи все её земли оказались фактически беззащитными к вторжению из вне. Сейчас этим воспользовались русские, направив свой контингент в Чехию. Русская армия беспрепятственно прошла по территории всей страны, и во многих местах приветствовалась населением как братья-славяне и освободители.\n\nФранция высказала сдержанную поддержку действиям союзницы, что стало вполне понятным сигналом для нового чешского правительства. Для всех становится очевидно, что с новым разделом сфер влияния ничего не поделать. Россия в Праге надолго."
 news_versailles.2.a: "Русские идут вперёд"
 news_versailles.3.t: "Публикация договора Сайкса-Пико"
 news_versailles.3.desc: "Новые власти России приступили к публикации дипломатических архивов с намерением разоблачить аннексионистские стремления бывших союзников. В одном из архивов ими обнаружены документы, касающиеся тайных договорённостей Антанты по разделу Османского государства.\n\nТак, весной 1916 года Франция, Англия и царская Россия подписали ряд договоров, по которым русские претендовали на западную Армению, регион Трапезунда и проливы, французы — на территории турецкого побережья в Анатолии и Сирии. Англичане рассчитывали на Ирак и Иорданию.\n\nРаздел в таком виде противоречит принципам, которые англо-французское командование само предложило арабским вождям. В Константинополе публикация соглашений вызвала смешанные чувства опасения и восторга."
 news_versailles.3.desc_1: "Новые власти России приступили к публикации дипломатических архивов с намерением разоблачить аннексионистские стремления бывших союзников. В одном из архивов ими обнаружены документы, касающиеся тайных договорённостей Антанты по разделу Османского государства.\n\nТак, весной 1916 года Франция, Англия и царская Россия подписали ряд договоров, по которым русские претендовали на западную Армению, регион Трапезунда и проливы, французы — на территории турецкого побережья в Анатолии и Сирии. Англичане рассчитывали на Ирак и Иорданию.\n\nРаздел в таком виде противоречит принципам, которые англо-французское командование само предложило арабским вождям. В Константинополе публикация соглашений уже не вызвала чувство сюрприза."
 news_versailles.3.a: "Большевики играют ва-банк"
 news_versailles.3.b: "Буржуазный обман разоблачён"
 news_versailles.4.t: "Конец арабского восстания"
 news_versailles.4.desc: "«Великое» арабское восстание в Хиджазе против османской власти завершено. Лидеры местных племен договорились с турками о прекращении войны и восстановлении османской власти над побережьем Красного Моря, над городами Мекка и Медина. Мятежные арабские вожди либо сдаются либо бегут вглубь полуострова, в то время как советники Антанты спешно уничтожают склады и грузятся на пароходы.\n\nПричиной произошедшего стало неудачное для союзников течение войны на Ближнем востоке и потеря контроля над Египтом."
 news_versailles.4.desc_1: "«Великое» арабское восстание в Хиджазе против османской власти завершено. Лидеры местных племен договорились с турками о прекращении войны и восстановлении османской власти над побережьем Красного Моря, над городами Мекка и Медина. Мятежные арабские вожди либо сдаются либо бегут вглубь полуострова, в то время как советники Антанты спешно уничтожают склады и грузятся на пароходы.\n\nПричиной произошедшего стало неудачное для союзников течение войны на Ближнем востоке и потеря контроля над Египтом, а также публикация тайных договоров, которые окончательно подорвали авторитет Антанты среди арабов Хиджаза."
 news_versailles.4.a: "Получат ли когда-нибудь арабы свободу?"
 news_versailles.5.t: "Британия поддерживает сионизм"
 news_versailles.5.desc: "После некоторых успехов на ближневосточном театре военных действий, кабинет министров Великобритании решился на акт поддержки сионизма. Официально опубликована правительственная телеграмма, направленная Бальфуром лорду Ротшильду и лидеру сионистов Хаиму Вайцману.\n\nВ тексте «декларации Бальфура» утверждается, что британская корона готова поддержать создание «национального дома» для евреев в виде отдельного государства в Палестине под протекторатом Англии.\n\nТаким образом, Британия намерена получить международную поддержку еврейских организаций, а также привлечь на свою сторону лидеров еврейских общин на территории Османской империи."
 news_versailles.5.a: "Их союз не удивляет"
 news_versailles.5.b: "Империалисты эксплуатируют чужой патриотизм"
 news_versailles.6.t: "14 пунктов Вильсона"
 news_versailles.6.desc: "Президент Америки Вудро Вильсон представил Конгрессу 14 пунктов для мирного соглашения в Европе. Этот документ призван отразить позицию демократических стран о завершении войны в противовес тому, что в своём декрете объявили русские большевики, а также претензиям Германии.\n\nПункты Вильсона предусматривают деоккупацию захваченных территорий, установление границ на основе уважения воли национальностей, свободу торговли и судоходства, отказ от тайной дипломатии и создание Лиги наций.\n\nВильсон отдельно указал на необходимость восстановления независимости Бельгии и создание нового польского государства, что явно вызовет недовольство в Германии, а последний пункт, возможно, и в России."
 news_versailles.6.desc_1: "Президент Америки Вудро Вильсон представил Конгрессу 14 пунктов для мирного соглашения в Европе. Этот документ призван отразить позицию демократических стран о завершении войны в противовес тому, что в своих мирных инициативах предлагает Германия.\n\nПункты Вильсона предусматривают деоккупацию захваченных территорий, установление границ на основе уважения воли национальностей, свободу торговли и судоходства, отказ от тайной дипломатии и создание Лиги наций.\n\nВильсон отдельно указал на необходимость восстановления независимости Бельгии и создание нового польского государства, что явно вызовет недовольство в Германии, а последний пункт, возможно, и в России."
 news_versailles.6.a: "14 пунктов! Сам Господь Бог предложил только 10"
 news_versailles.6.b: "14 пунктов! Сам боженька предложил только 10"
 news_versailles.7.t: "Президент США впервые в Европе"
 news_versailles.7.desc: "Лидер Северо-Американских Соединённых Штатов [USA.GetLeader] впервые выехал за пределы своего континента ради участия в грандиозной мирной конференции. Сейчас он находится в Европе, пропагандируя 14 пунктов как основу вечного, по его мнению, послевоенного мира.\n\nЛидер США посетил ряд европейских столиц. В честь него улицы украсили флагами и транспарантами, а политики увидели в этом жесте демонстрацию особого расположения и уже рассчитывают на совместный раздел мира.\n\nВ других странах Европы жители также с радостью приветствуют известия о поездке американского президента, связывая с его фигурой надежды на честный арбитраж международных споров, но лидеры стран более сдержаны во мнениях, ведь теперь влияние США, очевидно, возрастет."
 news_versailles.7.a: "Америка пришла в Европу"
 news_versailles.8.t_paris: "Открытие Парижской конференции"
 news_versailles.8.desc_paris: "Мирная конференция будет наконец открыта. Лидеры держав-победительниц договорились о месте встречи, где и будут решаться судьбы мира. Неудивительно, что им стала столица Франции, ведь французский народ выдержал главные тяготы войны на самом главном фронте.\n\nТеперь посланцам стран-участниц предстоит съехаться в Париж и приступить к обсуждению огромного числа вопросов международной политики, после чего требования победителей будут вручены проигравшим. В любом случае, французы - хозяева конференции - чувствуют себя на коне."
 news_versailles.8.t_london: "Открытие Лондонской конференции"
 news_versailles.8.desc_london: "Мирная конференция будет наконец открыта. Лидеры держав-победительниц договорились о месте встречи, где и будут решаться судьбы мира. Неудивительно, что им стала столица Великобритании, ведь именно мощь британской короны, откликнувшаяся на зов Европы о помощи, внесла один из решающих вкладов в победу.\n\nТеперь посланцам стран-участниц предстоит съехаться в Лондон и приступить к обсуждению огромного числа вопросов международной политики, после чего требования победителей будут вручены проигравшим. В любом случае, англичане - хозяева конференции - чувствуют себя на коне."
 news_versailles.8.t_petrograd: "Открытие Петроградской конференции"
 news_versailles.8.desc_petrograd: "Мирная конференция будет наконец открыта. Лидеры держав-победительниц договорились о месте встречи, где и будут решаться судьбы мира. Неудивительно, что им стала столица России, ведь русская армия всю войну сковывала огромные силы германцев и австрийцев на протяжённом фронте, неся потери во имя выполнения союзнического долга.\n\nТеперь посланцам стран-участниц предстоит съехаться в Петроград и приступить к обсуждению огромного числа вопросов международной политики, после чего требования победителей будут вручены проигравшим. В любом случае, русские - хозяева конференции - чувствуют себя на коне."
 news_versailles.8.t_roma: "Открытие Римской конференции"
 news_versailles.8.desc_roma: "Мирная конференция будет наконец открыта. Лидеры держав-победительниц договорились о месте встречи, где и будут решаться судьбы мира. Выбор пал на столицу Италии, ведь это была общая победа, и вклад итальянского народа был таким, какой был ему по силам. Наконец, такое нейтральное решение не обидит другие державы, оспаривающие приз решающего вклада.\n\nТеперь посланцам стран-участниц предстоит съехаться в Париже и приступить к обсуждению огромного числа вопросов международной политики, после чего требования победителей будут вручены проигравшим. В любом случае, итальянцы - хозяева конференции - чувствуют себя на коне."
 news_versailles.8.a: "Горе побеждённым"
 news_versailles.8.b: "Это не мир, а раздел мира"
 
 news_versailles.9.t: "Голосование за аншлюс Австрии"
 news_versailles.9.desc: "Австрийское национальное собрание провозгласило стремление к полноправному объединению с Германией. Это значит, что австрийские немцы готовы в любой момент отказаться от суверенитета и войти в состав единого государства.\n\nДолгие годы австрийские немцы мечтали о возможности войти в единое национальное государство, тем не менее, Габсбургская монархия, не без опоры на мадьяр и славян, сдерживала объединительный порыв австрийцев. Теперь же, весь немецкий народ может объединиться, если, конечно, страны-победительницы признают верным поощрять самоопределением тех, кто начал эту войну."
 news_versailles.9.a: "Исторический день"
 news_versailles.9.b: "Ещё один спор в Европе"
 
 news_versailles.10.t: "Антанта дозволяет аншлюс"
 news_versailles.10.desc: "Неожиданно страны Антанты подтвердили право Австрии на объединение с Германией. Союзное совещание постановило дозволить немедленное объединение двух государств в единый национальный организм.\n\nЭто приятно удивило немцев, и теперь они вновь видят проблески света относительно своего положения. Многие из них, да и многие наблюдатели во всём мире, вновь считают демократические принципы Антанты реальными."
 news_versailles.10.desc_1: "Неожиданно страны Антанты подтвердили право Австрии на объединение с Германией. Союзное совещание постановило дозволить немедленное объединение двух государств в единый национальный организм.\n\nЭто приятно удивило немцев, и теперь они вновь видят проблески света относительно своего положения. Многие из них, да и многие наблюдатели во всём мире, вновь считают демократические принципы Антанты реальными.\n\nВ свою очередь итальянцы, не пожелавшие использовать право «вето», внезапно оказались взбешены таким положением. Общество под влиянием ирредентистов негодует из-за неспособности дипломатов наказать Австрию, правительство вновь впадает в кризис."
 news_versailles.10.a: "Торжество народной воли"
 news_versailles.10.a_1: "Нельзя угодить всем"
 
 news_versailles.11.t: "Антанта воспрещает аншлюс"
 news_versailles.11.desc: "Как и ожидалось, страны Антанты восприняли идею объединения Австрии и Германии в штыки. Союзное совещание постановило воспретить упразднение австрийского суверенитета в пользу Берлина. Это резкое решение казалось предсказуемым, тем не менее, многие, и особенно немцы, в очередной раз разочарованы в том, как цинично союзники обходятся с собственными принципами.\n\nВена находится в недоумении относительно нарушения её прав о национальном самоопределении. И всё же, под угрозой итальянских штыков, Австрия... продолжит самостоятельное существование."
 news_versailles.11.a: "Среди австрийцев ещё может найтись решительный человек..."
 
 news_versailles.12.t: "Послевоенный порядок"
 news_versailles.12.desc: "Мирная конференция по итогам Мировой войны завершена. Карты перечерчены, победители получили очень многое, а проигравшие унижены, тем не менее, никто не удовлетворен и никто не успокоился. Со всех сторон доносятся призывы к новым конфликтам, к исправлению свежеподписанных договоров силой, как будто и не было четырёх лет войны, доказавших, что сила - последний аргумент в дипломатии."
 news_versailles.12.desc_1: "Мирная конференция по итогам Мировой войны завершена. Карты перечерчены, победители получили очень многое, а проигравшие унижены, тем не менее, никто не удовлетворен и никто не успокоился. Со всех сторон доносятся призывы к новым конфликтам, к исправлению свежеподписанных договоров силой, как будто и не было пяти лет войны, доказавших, что сила - последний аргумент в дипломатии."
 news_versailles.12.desc_2: "Мирная конференция по итогам Мировой войны завершена. Карты перечерчены, победители получили очень многое, а проигравшие унижены, тем не менее, никто не удовлетворен и никто не успокоился. Со всех сторон доносятся призывы к новым конфликтам, к исправлению свежеподписанных договоров силой, как будто и не было шести лет войны, доказавших, что сила - последний аргумент в дипломатии."
 news_versailles.12.desc_3: "Мирная конференция по итогам Мировой войны завершена. Карты перечерчены, победители получили очень многое, а проигравшие унижены, тем не менее, никто не удовлетворен и никто не успокоился. Со всех сторон доносятся призывы к новым конфликтам, к исправлению свежеподписанных договоров силой, как будто и не было семи лет войны, доказавших, что сила - последний аргумент в дипломатии."
 news_versailles.12.a: "У нас есть 20 лет передышки"
 
 news_versailles.13.t: "Самозатопление германского флота"
 news_versailles.13.desc: "После начала перемирия германский флот Открытого моря оказался в руках Антанты. Эскадра с немецкими экипажами была поставлена под контроль союзного флота, тем не менее, адмирал фон Ройтер сам отдавал распоряжения своим судам.\n\nЭтот факт стал роковой ошибкой союзников. Ожидая раздела или унизительного уничтожения германских кораблей Ройтер отдал приказ потопить свой флот в дни подписания конечной мирной декларации.\n\nСоюзники по Антанте взбешены, однако, по выражению адмирала Уэмисса “затопление - это небесный дар”, ведь никто не знал, что делать с этими самыми кораблями."
 news_versailles.13.a: "Немецкий флот погиб"
 versailles_german_fleet_sink_tt: "Германия теряет все корабли, кроме §Y6 линкоров§!, §Y6 крейсеров§! и §Y24 эсминцев§!"





