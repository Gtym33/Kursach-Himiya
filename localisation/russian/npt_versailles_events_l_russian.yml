 versailles.1.t: "Вопрос «Лиги наций»"
 versailles.1.desc: "Наконец, все участники мирной конференции готовы выступить. По настоянию президента США основным вопросом первого этапа переговоров станет создание «Лиги Наций» - особого международного органа, призванного предотвратить начало новых войн.\n\nНесмотря на важность этой миротворческой концепции, вокруг неё разгорелись жаркие споры, так как часть делегатов считает идею «международного арбитража» просто утопической американской поделкой и требует в свою очередь превращения «Лиги Наций» в мощный военный альянс.\n\nПопытки европейцев милитаризировать будущую лигу вызвали глубокое недовольство американской делегации: решение по данному вопросу в конце концов определит, вернется ли США к изоляционизму или пойдут рука об руку с Европой."
 versailles.1.a: "Лига наций будет создана как международный арбитраж"
 versailles.1.b: "Лига наций возникнет как продолжение Антанты"
 versailles.2.t: "Вопрос мандатных территорий"
 versailles.2.desc: "После завершения Мировой войны в распоряжении стран победительниц остались огромные территории в Азии, Африке и Тихом Океане, ранее бывшие колониями проигравших стран. Прямая передача их победителям в том же статусе не одобряется, ведь в корне противоречит духу 14 пунктов... однако, после рассмотрения вопроса о «Лиге наций», выдвинуто предложение признать данные территории «под мандатом» этой международной организации и ввести там управление, которое будет контролироваться на международном уровне.\n\nДля этого предлагается создать три уровня подмандатных территорий - A, B и C:\n* А - условно независимые территории, которые должны достичь полной независимости под покровительством одной из стран Лиги наций;\n* B - территории, на которых вводится внешнее управление;\n* С - интегрированные территории, фактически входящие в состав соответствующей страны держателя мандата.\n\nРаспределение мандатных территорий произойдёт в соответствии с ранее заключенными международными соглашениями стран Антанты."
 versailles.2.a: "Мандатная система начнёт действовать"
 versailles_2_tt: "Формируется марионеточная система трёх уровней:\n§Y«Мандатная территория класса §!§RA§!§Y»§! соответствует уровню §Y«Марионетка»§!\n§Y«Мандатная территория класса §!§2B§!§Y»§! соответствует уровню §Y«Интегрированная марионетка»§!\n§Y«Мандатная территория класса §!§GC§!§Y»§! соответствует уровню §Y«Плакатное правительство»§!"
 versailles.3.t: "Вопрос мандатов в Африке"
 versailles.3.desc: "Несмотря на то что мы пришли к соглашению по управлению территориями по мандатной системе, многие считают, что в отношении африканский колоний Германии это может быть простой формальностью. Итак, намерены ли мы создавать мандаты в Африке или просто включим эти территории в состав колониальных администраций, только формально называя их «подмандатными»?"
 versailles.3.a: "Африканские территории будут управляться мандатом класса «B»"
 versailles.3.b: "Африканские территории будут управляться как колонии"
 versailles.5.t: "Контроль Тангаики"
 versailles.5.desc: "В отсутствии на конференции представителя Британии мы вынуждены обсуждать вопрос принадлежности подмандатной Тангаики как спорный. В данном случае на регион претендуют Бельгия и Португалия - две союзнице по мировой войне из лагеря Антанты."
 versailles.5.a: "Передать Бельгии"
 versailles.5.b: "Передать Португалии"
 versailles.7.t: "Контроль Юго-Западной Африки"
 versailles.7.desc: "Вопрос Юго-Западной Африки оказался дискуссионным. Сейчас мы рассматриваем три варианта:"
 versailles.7.a: "Передать Португалии"
 versailles.7.b: "Передать Южной Африке"
 versailles.7.c: "Разделить колонию между двумя странами"
 
 versailles.11.t: "Мандат на ближневосточные территории"
 versailles.11.desc: "Повестка дня по обсуждению мандатов на ближневосточные территории включает в себя такие темы как:\n\n1. Возможное создание единого арабского государства;\n2. Возможное создание еврейского государства в Палестине;\n3. Возможное создание государства Курдистан;\n4. Возможное создание государства Ирак.\n\nВ случае отклонения этих инициатив территории будут перераспределены как мандатные в соответствии с ранее установленными международными договорами."
 versailles.11.a: "Мы разрубим ближневосточный узел"
 
 versailles.31.t: "Раздел Германии"
 versailles.31.desc: "Германия - страна, развязавшая мировую войну. Именно её кайзер, вопреки союзным мирным усилиям, двинул армии на Париж и Петроград. К её территориальному устройству есть множество вопросов: на востоке пруссаки подчинили себе исконно польские земли, на западе же, рассматривается Рейнский вопрос - идея об оккупации или отделении наиболее промышленно развитой части Германского союза."
 versailles.31.a: "Так или иначе, немцы заплатят за всё"
 versailles.32.t: "Раздел Германии"
 versailles.32.desc: "Желая говорить о разделении Германии, мы встретились с парадоксальным объединением Германии. Ныне независимая Австрия, немецкая часть бывшей Австро-Венгрии, демократическим образом выявила желание присоединиться к национальному телу и войти в состав Германии.\n\nОтказ не составит нам труда, ибо негоже усиливать тех, кто не умеет распоряжаться своей силой. Германию должно наказывать, а не поощрять. И всё же, отказ в объединении продемонстрирует нашу полную беспринципность. Мы нарушим их права, и немцы запомнят это надолго."
 versailles.32.a: "Аншлюсу не бывать!"
 versailles.32.b: "Право на самоопределение осуществится"
 versailles.32.c: "Италия накладывает вето"
 versailles_anschluss_veto_tt: "Гарантированно не будет объединения, однако §Yсила голоса§! нашей делегации на последующих голосованиях снизится"
 european_peace_conference_anschluss_veto_opinion: "Вето на аншлюс"
 
 versailles.34.t: "Вопрос объединения"
 versailles.34.desc: "Распад Габсбургской империи привёл Австрию в состояние небольшого куска земли с чисто немецким населением. Тем не менее, даже это многие австрийцы восприняли положительно. Начиная с 1848 года в Австрии шли постоянные брожения по вопросу объединения с Германией, однако австрийские немцы вынуждены были жить в многонациональной империи вместо германского национального союза. Теперь, когда империи нет, Австрия свободна объединиться с Германией."
 versailles.34.a: "Национальное собрание голосует за единство"
 
 versailles.35.t: "Бескровное поглощение Австрии"
 versailles.35.desc: "Желая говорить о разделении Германии, мы встретились с парадоксальным объединением Германии. Ныне независимая Австрия, немецкая часть бывшей Австро-Венгрии, демократическим образом выявила желание присоединиться к национальному телу и войти в состав Германии.\n\nОтказ не составит нам труда, ибо негоже усиливать тех, кто не умеет распоряжаться своей силой. Германию должно наказывать, а не поощрять. И всё же, отказ в объединении продемонстрирует нашу полную беспринципность. Мы нарушим их права, и немцы запомнят это надолго."
 versailles.35.a: "Это немыслимо, но это так"
 
 versailles.36.t: "Дипломатическое унижение"
 versailles.36.desc: "Германия и Австрия объединяются. Италия, обескровленная войной Италия, унижена собственными союзниками. В то время как наши дипломаты благосклонно отказались применять «вето» по вопросу аншлюса Австрии, остальные страны-участницы спокойно проголосовали за! Теперь австрийские немцы награждены за годы унижения итальянцев тем, что усилят собой Германский Рейх. Германия явится на наших границах, и мы как будто бы и не победили в войне!"
 versailles.36.desc_1: "Германия и Австрия объединяются. Италия, обескровленная войной Италия, унижена собственными союзниками и собственным правительством. Наши дипломаты благосклонно отказались применять «вето» по вопросу аншлюса Австрии и вообще уважили право австрийцев на самоопределение. Теперь камни летят в наше правительство: австрийские немцы награждены за годы унижения итальянцев тем, что усилят собой Германский Рейх. Германия явится на наших границах, и мы как будто бы и не победили в войне!"
 versailles.36.a: "Нам нечего делать в Антанте"
 versailles.36.b: "Это ещё не всё! Наше участие в конференции продолжится!"
 versailles.36.c: "Народ поймёт нашу правоту потом"
 
 versailles.37.t: "Разоружение Германии"
 versailles.37.desc: "Вопрос разоружения Германии включает в себя сразу несколько блоков:\n\n1. Сокращение армии;\n2. Сокращение военных производств;\n3. Сокращение или раздел флота.\n\nПо первому пункту спор идёт о полном упразднении германской регулярной армии до уровня 100 тысячной призывной милиции по проекту маршала Фоша, либо менее драконовскими мерами в виде сохранения сохранения профессиональной армии 100-150 тысяч человек по британскому проекту.\n\nОдновременно с этим идёт спор об упразднении германских военных производств и переводе их на сугубо гражданские рельсы. Континентальные страны, граничащие с Германией, хотят не только обрезать число германских солдат, но и отобрать у них винтовку."
 versailles.37.a: "Максимальное сокращение сил"
 versailles_demilitarization_tt: "10 немецких военных заводов принудительно конвертируются в гражданские"
 versailles.37.b: "Попробуем быть разумными"
 
 versailles.39.t: "Раздел германского флота"
 versailles.39.desc: "На протяжении войны Германский флот оказался крепким орешком, который не смогла разгрызть даже владычица морей Великобритания. Более того, в нескольких морских сражениях немцы серьезно проредили силы английского флота, а вступление в войну субмарин и вовсе поставило Англию на риск военного поражения именно на море. В таких условиях оставление флота Германии считает крайне опасным.\n\nСейчас германские корабли отконвоированы на базы Антанты и находятся под присмотром союзных линкоров, однако в дальнейшем их нужно либо разделить, либо утопить, либо вернуть Германии."
 versailles.39.a: "Германский флот будет разделён как трофей"
 versailles.39.b: "Просто утопим их"
 
 versailles.41.t: "Размер германских репараций"
 versailles.41.desc: "Когда мы говорим, что Германия должна заплатить, мы действительно имеем в виду оплату деньгами и иными ценностями. Вопрос лишь в размерах. Усиленное изъятие средств из германской экономики приведет её к стагнации и длительному кризису, это не выгодно Британии и Америке, но максимально выгодно континентальным странам соперницам Германии.\n\nОт размера репараций также зависит внутреннее состояние немецкого общества. Ввергнув его в экономический кризис, мы тем самым приведём Германию к дестабилизации, и неизвестно, кто в таком случае придёт к власти и будут ли они вообще соблюдать наши запреты."
 versailles.41.a: "Максимальный размер репараций"
 versailles.41.b: "Средний размер репараций"
 versailles.41.c: "Умеренные репарации"
 
 versailles.43.t: "Вопрос Рейнании"
 versailles.43.desc: "Французский штаб, а также лидер страны [FRA.GetLeader] давят на участников конференции в вопросе передаче Франции наиболее промышленно развитого региона Германии: Рейнской области и входящего в неё угольного бассейна Рура. Французы недвусмысленно указывают, что считают такую уступку, с одной стороны компенсацией ущерба, с другой - прививкой от возрождения милитаризма Германии.\n\nОднако другие участники конференции смотрят на предложения Парижа скептически: именно такой территориальный спор вокруг Эльзаса и Лотарингии отчасти стал причиной Мировой войны, и вот теперь французы готовятся создать новый. К тому же, Англия вовсе не хочет видеть своего «союзника» в качестве нового гегемона Европы.\n\nВстретив сопротивление, французы пытаются протолкнуть более мирные варианты, например, вместо аннексии предлагается создание свободной независимой Рейнании (под протекторатом Франции)."
 versailles.43.a: "Рейнания справедливо отойдёт к Франции"
 versailles.43.b: "Рейнания станет протекторатом"
 versailles.43.c: "Мы не поддержим несправедливые аннексии"
 
 versailles.45.t: "Вопрос польского коридора"
 versailles.45.desc: "Ещё одним болезненным территориальным вопросом для Германии является создание так называемого «Польского коридора». Это специальное требование польских представителей о выделении им земель, ведущих от польских континентальных территорий к Балтийскому морю через город Данциг.\n\nПоляки намерены получить все эти территории целиком, включая последний порт, однако всем ясно, что столь грубое отсечение вызовет ещё больше проблем с Германией в будущем. Так что союзники предлагают вариант, в котором Польша получит указанные территории, но Данциг останется независимым и под протекторатом союзных сил, как бы не принадлежа ни к Польше, ни к Германии."
 versailles.45.a: "Передать коридор полякам"
 versailles.45.b: "Передать без Данцига"
 versailles.45.c: "Польше достаточно того, что есть"
 
 versailles.47.t: "Данцигское унижение"
 versailles.47.desc: "Стали известны детали нового унижения Германского Рейха кучей иностранных стервятников: на этот раз у Германии изымают часть территории Пруссии в пользу новосозданной Польши.\n\nЭто новое-старое государство Европы намерено разделить Восточную и Западную Пруссии коридором присвоенных территорий с той целью, чтобы через город Данциг выйти к Балтийскому морю. И это признаётся Антантой разумным!"
 versailles.47.a: "Разве у Польши есть флот?"
 
 versailles.51.t: "Итоги конференции"
 versailles.51.desc: "Мирная конференция, наконец, подошла к концу. Огромное количество споров и обсуждений завершились, и хотя результаты не могли удовлетворить всех, оглядывая карту Европы и карту Земли, участники соглашаются, что мир никогда уже не будет прежним. Как бы то ни было, Антанта, завершившая эту войну победой, теперь неумолимо идёт к расколу, Германия проиграла, а множество участников войны по всему миру уже сейчас требуют пересмотреть результаты «несправедливых» договоров. Да и войны вовсе не закончились."
 versailles.51.a: "Мы сделали всё, чтобы мир был прочным"
 versailles.51.b: "Могло ли быть хуже?"
 versailles_final_tt: "По результатам мирной конференции ряд стран получит поводы к войне"
 
 
 
 versailles.101.t: "Болгарская проблема"
 versailles.101.d: "Согласившись на простое заключение перемирия с болгарами мы смогли извлечь все возможные выгоды, однако теперь эта страна не представляет собой ничего особенного. И на Балканах, и в Европе её помнят как одну из поджигательниц войны. А перспективы приобрести такого союзника путём его защиты перед мировым сообществом мало привлекательны."
 versailles.101.a: "Эти соглашения должны быть пересмотрены"
 versailles.101.b: "Мы не станем нарушать обязательств"
 
 versailles.102.t: "Благоприятная обстановка"
 versailles.102.d: "На наш запрос в дипмиссии стран Антанты мы с удовлетворением смогли получить уверения о невозможности пересмотра ранее заключенных соглашений."
 versailles.102.a: "Можно преступать к демобилизации"
 
 versailles.103.t: "Тревожная обстановка"
 versailles.103.d: "По дипломатическим каналам до нас доходят известия о намерении западных лидеров пересмотреть заключенные ранее соглашения, в пользу своих балканских сателлитов. Никто в Болгарии не хочет войны, однако подобные выходки великих держав способны вновь разжечь пламя войны и революции на Балаканах."
 versailles.103.a: "Следует подготовиться к любому развитию событий"
 
 versailles.104.t: "Добруджанский вопрос"
 versailles.104.d: "По условиям мира 1913 года Болгария лишилась южной части Добруджи. Великая война позволила болгарам вернуться, однако теперь она окончена. И болгары и румыны считают весь полуостров своей исконной землей. Между тем распределение этнического элемента действительно изменяется с севера на юг."
 versailles.104.a: "Вся Добруджа должна быть румынской"
 versailles.104.b: "Следует исходить из единственно справедливого этнического принципа"
 
 versailles.105.t: "Добруджанский кризис"
 versailles.105.d: "Великие державы приступили к открытому диктату. Правительство получило предписание очистить от войск Добруджанский полуостров, в противном случае сконцентрированные войска Антанты перейдут в наступление при поддержки флота. Естественно, что продолжение войны со всем миром попросту невозможно и предписание будет выполнено. Однако внутри Болгарии это вызовет неминуемый раскол и возможно правительственный кризис."
 versailles.105.a: "Ничего хорошего ждать не приходится"
 
 versailles.106.t: "Греческие претензии на восточную Фракию"
 versailles.106.d: "Восточная Фракия долгое время считается спорной территорией и сейчас греки вновь нашли необходимым поднять вопрос о её статусе. Греческий премьер утверждает о доминировании греческого элемента в регионе, к тому же он готов заключить соглашение об обмене населением с болгарской стороной. Болгары же возражают, что греческого элемента нет никакого вовсе, но также готовы заключит соглашение об обмене. Также болгары требуют провести референдум среди самих жителей и указывают, что простая передача Фракии грекам лишит их страну выходу к морю и подорвет и без того пострадавшую болгарскую экономику."
 versailles.106.a: "Позиция Греции выглядит убедительнее"
 versailles.106.b: "Пусть население само решает свою судьбу"
 
 versailles.107.t: "Итоги референдума во Фракии"
 versailles.107.d: "По инициативе Великих держав в болгарской Фракии был проведен плебисцит по вопросу о государственной принадлежности данного региона. Граждане уверенно проголосовали в пользу Болгарии и её суверенитет здесь был сохранён."
 versailles.107.a: "Благоразумие возобладало"
 versailles.107.b: "Фракийские греки слишком сильно оболгарены..."
 
 versailles.108.t: "Македонский вопрос"
 versailles.108.d: "Македония представляет собой обширный регион на пересечении интересов трех соседей – Болгарии, Сербии и Греции. При преобладающем славянском населении ешё по Сан-Стефанскому миру Вардарская Македония была передана Болгарии, однако последующие перипетии войны и дипломатии перенесли её под суверенитет Сербии. Греция также имеет здесь претензии, впрочем очень слабые, даже для этого горделивого народа.\nСтоит учитывать и фактор действия в Македонии революционной организации, отчасти проболгарской, отчасти абсолютно сепаратистской. Среди местных жителей идея суверенитета Македонии имеет определённую поддержку. Её также считают компромиссной правительственные круги в Софии, они полагают что выделение Македонии приведёт к победе болгарского элемента и создаст известное препятствие для соединения греков и сербов."
 versailles.108.a: "Единство Сербии не может быть нарушено"
 versailles.108.b: "Суверенная Македония явится приемлемым компромиссом"
 versailles.108.c: "После референдума сербам нечего будет возразить"
 
 versailles.109.t: "Македония"
 versailles.109.d: "Союзное командование вместо передачи Македонии Сербии решило провести референдум, по результатам которого Македония остаётся в Болгарии."
 versailles.109.a: "Благоразумие возобладало"
 versailles.109.b: "Предательство"
 
 versailles.110.t: "Стратегические притязания Сербии"
 versailles.110.d: "Сербское правительство составило проект сдвижения границы с Болгарией на восток. Претензии невелики, но при том сербский генералитет считает их стратегически необходимым условием умиротворения Болгарии впредь. Население регионов чисто болгарское."
 versailles.110.a: "После катастрофы 1915 года сербы в полном праве поступать как угодно"
 versailles.110.b: "Объясните сербам, что две деревни не спасут их армию через 20 лет"
 
