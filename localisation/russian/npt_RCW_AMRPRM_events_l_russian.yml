 news_n.1013.t: "Белые оставляют Сибирь"
 news_n.1013.d: "Русские белогвардецы похоже теряют свои последнии позиции в Сибири. По сообщениям иностранных наблюдателей и большевистской прессы белая армия покидает развалившийся фронт и начинает отступление за Байкал.\n\nПоложение белогвардецев крайне серьезное, так как всюду они окружены мятежами, восстаниями и отрядами партизан. Иностранные союзники больше не поддерживают их власть. Железнодорожное сообщение практически уничтожено и снабжения нет.\n\nМало кто верит, что сибирские белые достигнут Читы, тем не менее, их лидеры всё ещё не сложили оружие, а значит Гражданская война в России ещё не кончилась."
 news_n.1013.a: "Серьезный удар по врагам большевиков"
 news_n.1014.t: "Японская интервенция на Дальний восток"
 news_n.1014.d: "Министерство иностранных дел Японии выпустило официальное коммюнике по ситуации в российском Приморье. В документе говорится о необходимости защитить союзные интересы в регионе, устранить чрезмерно возросшее и угрожающее влияние Германии и развернуть собственную военную миссию во Владивостоке.\n\nПоводом для выступления очевидно служит занятие Владивостока белыми русскими войсками, свергнувшими большевиков. Японская интервенция будет поддержана в военном и дипломатическом смысле союзниками по Антанте."
 news_n.1014.a: "Это серьезно изменит обстановку в регионе"
 news_n.1015.t: "Японское вторжение в Сибирь"
 news_n.1015.d: "Дальний Восток потрясен новым известием: после провала переговоров забайкальского и сибирских правительств Японская армия перешла русскую границу. Фактически речь идёт о полномасштабном вводе японских войск в Забайкальский край по запросу Читы. Формально всё описывается как миротворческая миссия, но этим она явно не ограничится.\n\nСоюзные дипломаты уже выразили обеспокоенность столь беспринципными действиями Японской Империи. В тоже время в Токио сторонники агрессивного расширения празднуют начало Второй Русско-Японской войны. Члены общества “Кокурюкай” требуют от армии полностью покорить Амру японской власти."
 news_n.1015.a: "Аппетиты японцев растут"