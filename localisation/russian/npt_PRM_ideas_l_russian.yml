PRM_vladivostok_is_under_allied_control: "Владивосток под союзным контролем"
PRM_vladivostok_is_under_allied_control_desc: "В бухте Золотой Рог стоят корабли Антанты, а вслед за чехословаками во Владивосток прибывают новые иностранные войска. Их присутствие обеспечивает городу снабжение и связь с внешним миром, но всё меньше оставляет местной власти возможности распоряжаться собственной столицей."
PRM_competition_among_siberial_governments: "Конкуренция сибирских правительств"
PRM_competition_among_siberial_governments_desc: "Правительство Дербера объявляет себя законной центральной властью всей Сибири, но на западе правительство Вологодского заявляет о тех же правах. Пока два кабинета спорят о законности друг друга, реальная военная сила находится в руках офицеров, казаков и интервентов. "
PRM_cossacks_willfunlness: "Своеволие казаков"
PRM_cossacks_willfunlness_desc: " “Белая” часть уссурийского казачества подчинена в основном своему атаману, а он не подчиняется никому и не признаёт власти Владивостока."

PRM_Not_impossible_to_neutralitet: "£GFX_red_cross_small Невозможно удалить закон о “Нейтралитете”"
