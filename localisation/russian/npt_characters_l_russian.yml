 RGR_Aleksandr_Muhanov: "Александр Муханов"
 RGR_Aleksandr_Muhanov_DESC: "Александр Владимирович Муханов — военный деятель, родился 4 марта 1874 года в Санкт-Петербурге. Образование получил во 2-м кадетском корпусе и 1 сентября 1893 года поступил на военную службу. После Октябрьской революции выступал на стороне Белого движения в Туркестане, боролся против Красной армии. Позднее добровольно перешёл на службу в Красную армию и занимал должность помощника во 2-й Туркестанской стрелковой дивизии Рабоче-крестьянской Красной армии. В дальнейшем был включён в списки Генерального штаба Красной армии. После этого Муханов был арестован в Ферганской области как участник повстанческого движения против красных."
 
 RGR_Nestor_Kalandarishvili: "Нестор Каландаришвили"
 RGR_Nestor_Kalandarishvili_DESC: "Нестор Александрович Каландаришвили родился 26 июня 1876 года в деревне Квирикети, Гурийский уезд, Кутаисская губерния. С 1903 года состоял в партии эсеров, а некоторое время — в Революционной партии социалистов-федералистов Грузии. Участвовал в первой русской революции, в том числе в Гурийском крестьянском восстании 1905—1906 годов. В 1907 году был арестован, а в 1908 году сослан в Сибирь. Вскоре сбежал, но в 1912 году вновь арестован и вновь сослан в Сибирь. Освобождён в феврале 1917 года в период революции. В 1917 году присоединился к партии анархистов-коммунистов и создал в Иркутске эскадрон анархистов."
 
 RGR_Grigoriy_Rogov: "Григорий Рогов"
 RGR_Grigoriy_Rogov_DESC: "Григорий Фёдорович Рогов родился в 1883 году в селе Жуланиха Мариинской волости Барнаульского уезда. Участвовал в Русско-японской, Великой и Гражданской войнах. Был кавалером трёх Георгиевских крестов и имел звание зауряд-прапорщика. В ходе Гражданской войны перешёл на анархические позиции, организовывал партизанские отряды на Алтае и сотрудничал с Красной армией."
 
 RGR_Alexey_Dolinin: "Алексей Долинин"
 RGR_Alexey_Dolinin_DESC: "Алексей Долинин, 1893 года рождения. Из крестьян, участник Мировой войны, поручик. Вернувшись с войны, возглавил советскую власть в родном селе Самарской губернии. С началом крестьянских волнений возглавил отряд односельчан, пользуясь авторитетом среди крестьянских масс Ставропольского уезда и шире, Самарской губернии, выделился в качестве лидера всего повстанческого движения."
 
 RGR_Alexandr_Sapozhkov: "Александр Сапожков"
 RGR_Alexandr_Sapozhkov_DESC: "Александр Сапожков, год рождения неизвестен. Из крестьян, участник Мировой войны, подпоручик. После Февральской революции глава Новоузенского совета, в 1918 году избран членом самарского губернского революционного комитета. Воевал на стороне красных, после серии конфликтов организовал мятеж формировавшейся кавалерийской дивизии, положив начало повстанческому движению в Самарской губернии."
 
 RGR_Alexandr_Antonov: "Александр Антонов"
 RGR_Alexandr_Antonov_DESC: "Александр Антонов, 1889 года рождения. Из мещан, член ПСР с 1907 года, участник революционных акций, каторжанин. После Февральской революции глава уездной милиции, организатор разоружения чехословацких эшелонов. После свержения временного правительства порвал с большевиками и ушел в подполье, создав вооруженный отряд. С началом крестьянских волнений в Тамбовской губернии включился в борьбу, быстро выделившись в качестве лидера повстанческого движения."
 
 RGR_Pyotr_Tokmakov: "Пётр Токмаков"
 RGR_Pyotr_Tokmakov_DESC: "Пётр Михайлович Токмаков родился в селе Иноковка Тамбовской губернии, Кирсановского уезда. В 1904 году был призван на службу в армию во время Русско-японской войны. Во время Первой мировой войны сражался в Галиции. После Брест-Литовского мира с Германией вернулся на свою родную землю, в Тамбовскую губернию, и устроился работать милиционером в село Иноковка. Позже он организовал партизанский отряд, покинув службу у большевиков. В дальнейшем присоединился к организованной Александром Антоновым партизанской армии Тамбовского крестьянского восстания."
 
 RGR_Ivan_Solovyov: "Иван Соловьёв"
 RGR_Ivan_Solovyov_DESC: "Иван Соловьев, 1890 года рождения. Сибирский казак, служил у белых. С началом крестьянских и хакасских волнений сколотил свой отряд, быстро возглавив все повстанческое движение на территории Енисейской губернии."
 
 
 RGR_Peter_Kulikovsky: "Петр Куликовский"
 RGR_Peter_Kulikovsky_DESC: "Пётр Александрович Куликовский родился в 1869 году в Старорусском уезде Новгородской губернии. Он был российским террористом, правым эссеистом и участником Белого движения. Из дворянской семьи Старорусского уезда. В молодости участвовал в студенческих выступлениях. В 1903 году за революционную деятельность был выслан в Якутскую область, в селение Усть-Майское. Летом 1904 года сбежал из ссылки. После возвращения в Санкт-Петербург присоединился к партии эсеров и входил в её боевую организацию. 11 июня 1905 года был арестован, однако сумел бежать из-под ареста. После Февральской революции активно участвовал в политической и общественной жизни Якутска, присутствовал на областных съездах якутов и русских крестьян трёх округов."
 
 RGR_Vasily_Zheltovsky: "Василий Желтовский"
 RGR_Vasily_Zheltovsky_DESC: "Василий Максимович Желтовский — сибирский крестьянин и один из руководителей антибольшевистского восстания в Западной Сибири. Родился в 1895 году в деревне Желтовское, Кугаевская волость, Тобольский уезд. Его семья была крестьянами в той же деревне. Принимал участие в службе делопроизводителя военкомата Кугаевской волости и ведал своим средним крестьянским хозяйством. Являлся членом партии социалистов-революционеров."
 
 RGR_Vladimir_Rodin: "Владимир Родин"
 RGR_Vladimir_Rodin_DESC: "Владимир Алексеевич Родин — бывший партийный эссер и один из руководителей Западно-Сибирского крестьянского восстания. Являлся сторонником Белого движения и служил в Русской армии в звании поручика. Впоследствии жил на территории Соколовской волости Ишимского уезда, работая учителем в селе Белое. Затем командовал Налобинским и Петропавловским боевыми участками повстанцев."
 
 RGR_Vladimir_Strekopytov: "Владимир Стрекопытов"
 RGR_Vladimir_Strekopytov_DESC: "Владимир Васильевич Стрекопытов родился в 1890 году в Туле в семье торговца и фабриканта. Он не проходил действительную военную службу; после достижения призывного возраста в 1911 году, по результатам жеребьёвки, был зачислен в ратники. Позже, после демобилизации из русской армии, вернулся в Тулу и вступил в партию РСДРП (меньшевиков). В годы гражданской войны был мобилизован в Красную армию, однако позднее был арестован Тульской ЧК по обвинению в контрреволюционной агитации. В тот же год он был освобождён по ходатайству командиру полка и в связи с отправкой полка в прифронтовую зону — в города Бобруйск и Гомель."
 
 RGR_Ivan_Kolesnikov: "Иван Колесников"
 RGR_Ivan_Kolesnikov_DESC: "Иван Сергеевич Колесников родился в 1894 году в селе Старой Калитве, Острогожском уезде Воронежской губернии. Во время Первой мировой войны служил и дослужился до звания вахмистра. В начале гражданской войны участвовал в боях в составе Красной армии, однако позже дезертировал. После этого начал сопротивляться продразвёрстке и мобилизации, которые начались в его родном селе Старой Калитве."
 
  RGR_Andrey_Avramenko: "Иван Каменюка"
 RGR_Andrey_Avramenko_DESC: "Андрей Андреевич Авраменко (Иван Каменюка), родившийся в 1880 году, в молодости работал батраком в селе Петропавловка. В начале Первой мировой войны был призван на флот и служил матросом на Черноморском флоте. Позднее он присоединился к анархистам. Со своим отрядом, действовавшим в Старобельском уезде, он поддержал Петлюру и участвовал в антигетманском восстании Директории Украинской Народной Республики. После этого вместе со своим отрядом присоединился к частям Нестора Махно."
  
 RGR_Dmitry_Okhranyuk_Chersky: "Григорий Охранюк-Черский"
 RGR_Dmitry_Okhranyuk_Chersky_DESC: "Григорий Охранюк-Черский — командир 49-го кавалерийского дивизиона Рабоче-крестьянской Красной Армии. В ходе службы он приобрёл опыт борьбы с крестьянскими восстаниями, действуя против повстанцев в районе Преображенского завода в Башкирии. В дальнейшем, при ликвидации другого очага восстания, он вместе с командиром 75-го эскадрона Внутренних войск Советской России Куватовым обменивались дипломатическими делегациями с повстанцами, предлагая сдаться и гарантируя жизнь участникам восстания."
 
 RGR_Ahmet_Zaki_Validi: "Ахмет-Заки Валиди"
 RGR_Ahmet_Zaki_Validi_DESC: "Ахметзаки Валиди родился 10 декабря 1890 года в деревне Кузяново Ильчик-Тимировской волости, Стерлитамакского уезда, Уфимской губернии. Его родители были религиозными деятелями, обладали отличным образованием и владели несколькими языками. В начале революционных событий в России он стал членом Временного центрального бюро российских мусульман и был избран членом Икомус. Также был депутатом Всероссийского учредительного собрания от Уфимской губернии и членом Миллэт Меджлиси. Позже присоединился к партии социалистов-революционеров."
 
 RGR_Yefim_Kuptsov_Skorodumov: "Ефим Купцов-Скородумов"
 RGR_Yefim_Kuptsov_Skorodumov_DESC: "Ефим Петрович Скородумов, более известный под псевдонимами Юшка или Юшко, родился в 1898 году в деревне Красково, Мирславской волости, Юрьевского уезда, в семье крестьянина-середняка и плотницкого дел мастера. В годы гражданской войны дезертировал из Красной армии. Под видом отпускника он вернулся на свою родную землю — в деревню Красково. Затем, скрываясь в лесах, он наладил связь с другими дезертирами и впоследствии начал антисоветскую деятельность."
 
 RGR_Evgeny_Mirovitsky: "Евгений Мировицкий"
 RGR_Evgeny_Mirovitsky_DESC: "Евгений Лукич Мировицкий — бывший полковник Белой армии, призванный в ряды «белых» из числа донских казаков. Впоследствии оказался в плену и отбывал наказание в трудовом лагере Челябинска, позже из которого сбежал и обосновался в окрестностях села Еткуль. Там началось формирование боевого отряда, известного как «Голубая армия». Слухами по округе стало распространяться, что в Назаровском бору создается новое повстанческое соединение. В лес стянулись казаки, дезертиры, монархисты и крестьяне. Мировицкий рассматривал себя как оппонента большевиков, а главными врагами своей вооруженной силы он называл «Красных»."
 
 RGR_Nikifor_Grigoriev: "Никифор Григорьев"
 RGR_Nikifor_Grigoriev_DESC: "Никифор Александрович Григорьев — по происхождению крестьянин Летичевского уезда Подольской губернии, православного вероисповедания. Родился в местечке Дунаевцы и при рождении носил фамилию Серветник. В 17 лет, 13 февраля 1901 года, поступил на военную службу добровольцем. Участвовал в Русско-японской и Великой войнах. После Февральской революции был назначен начальником учебной команды 35-го запасного пехотного полка. Участвовал в съезде фронтовиков и попал под влияние Симона Петлюры. Во время первой советско-украинской войны поддерживал украинскую Центральную Раду и был награждён званием подполковника. Позднее стал противником гетманского режима в Украине."
 
 RGR_Daniel_Terpilo: "Даниил Терпило"
 RGR_Daniel_Terpilo_DESC: "Даниил Ильич Терпило родился в Киевской губернии, в селе Триполье. Образование получил в начальной школе и двухклассном училище, которое готовило учителей для сельских школ. После революции 1905 года стал членом партии социалистов-революционеров. В 1908 году из-за революционной деятельности был сослан в Архангельскую губернию, в Холмогоры. Но после амнистии политических заключённых вернулся на родину. Участвовал в Великой войне, служил на Западном фронте в должности писаря при штабе 35-го армейского корпуса. После войны снова вернулся в Триполье и активно участвовал в политической жизни: организовал местную ячейку партии украинских социал-демократов и подразделение «Вольного казачества», а также агитировал за Центральную Раду."
 
 RGR_Mikhail_Przhevalsky: "Михаил Пржевальский"
 RGR_Mikhail_Przhevalsky_DESC: "Михаил Алексеевич Пржевальский родился 5 ноября 1859 года и происходил из дворян Тверской губернии. Его отец — генерал Алексея Кузьмича Пржевальского. В марте 1892 года он перешёл на дипломатическую службу, получил чин надворного советника и был назначен секретарём генерального консульства в городе Эрзеруме. 13 декабря 1908 года его назначили начальником Кубанской пластунской бригады, которая принимала участие в Великой войне."
 
 RGR_Pavel_Baltakhinov: "Павел Балтахинов"
 RGR_Pavel_Baltakhinov_DESC: "Павел Сергеевич Балтахинов родился в 1900 году в улусе Тараса, Боханского района Иркутской губернии, в бедной крестьянской бурятской семье. Во время обучения в духовной семинарии познакомился с произведениями революционных демократов — Чернышевского, Герцена и Добролюбова, что позволило ему критически оценивать порядки в училище и окружающую обстановку. В семинарии он общался с революционно настроенными студентами, участвовал в нелегальном политическом кружке и изучал революционную литературу. Однако руководство, узнав о деятельности кружка, исключило из учебного заведения нескольких наиболее «опасных» участников. Не стремясь сразу возвращаться к учёбе, Балтахинов переключился на практическую революционную деятельность и активно её развивал."
 
 RGR_Kharlampy_Ermakov: "Харлампий Ермаков"
 RGR_Kharlampy_Ermakov_DESC: "Харлампий Васильевич Ермаков родился 7 февраля 1891 года на хуторе Антипове станицы Вёшенской Области Войска Донского, в семье донского казака. В январе 1913 года он был призван на действительную службу в Донской 12-й казачий полк. В годы Первой мировой войны находился на Юго-Западном фронте и участвовал в боевых действиях до осени 1916 года. В мае 1917 года его избрали депутатом от Вёшенской станицы в Большой Войсковой круг. В начале Гражданской войны на Дону он поддержал Донской Военно-революционный комитет во главе с Ф. Подтёлковым и Н. М. Голубовым."
 
 RGR_Mikhail_Artemyev: "Михаил Артемьев"
 RGR_Mikhail_Artemyev_DESC: "Михаил Константинович Артемьев родился в ноябре 1888 года в Бетюнском наслеге Ботурусского улуса Якутской области в бедной крестьянской семье. Участвовал в Гражданской войне, изначально выступая на стороне большевиков. Якутским революционным штабом РККА был назначен комиссаром волости, а позже — председателем ревкома. В параллель продолжал работать учителем в различных образовательных учреждениях Якутии. Со временем разочаровался в советской власти и в итоге убежал из Якутска, вступив в ряды якутских повстанцев. После этого он работал в штабе Якутской Народной Армии."
 
 RGR_Yakov_Tryapitsin: "Яков Тряпицын"
 RGR_Yakov_Tryapitsin_DESC: "Яков Иванович Тряпицын родился 13 апреля 1897 года в селе Саваслейка Муромского уезда Владимирской губернии в семье крестьянина Ивана Степановича Сидорова-Тряпицына. В летние месяцы 1916 года он был зачислен рядовым в Кексгольмский полк. Во время Первой мировой войны дослужился до звания прапорщика. После демобилизации из действующей армии в связи с подписанием Брестского мира, он вернулся домой и вступил в Красную Гвардию. Позже, проезжая через Омск, направился в Восточную Сибирь и на Дальний Восток для участия в борьбе за Советскую власть."
 
 RGR_Ivan_Gamov: "Иван Гамов"
 RGR_Ivan_Gamov_DESC: "Иван Михайлович Гамов — известный общественный деятель, родившийся в 1885 году. В ранние годы он обучался в четырёхклассном городском училище в Благовещенске, а позднее окончил педагогические курсы. В период своей деятельности он представлял интересы своих избирателей в Государственной думе, присоединившись к фракции конституционных демократов. Также он принимал участие в работе Казачьей и Сибирской парламентских групп. Гамов активно участвовал в февральской революции и был избран атаманом Амурского казачьего войска. После октябрьской революции он занял позицию против большевистской власти."
 
 RGR_Thomas_Matveyevich: "Фома Матвеевич"
 RGR_Thomas_Matveyevich_DESC: "Алексей Васильевич Мокроусов — настоящие имя и отчество Фома Матвеевич. Родился 9 июня 1887 года в деревне Поныри, Курская губерния, в многодетной крестьянской семье. В ранние годы потерял родителей и в 1904 году отправился на заработки в Таврическую губернию. В период революции 1905 года находился на работе шахтёром на Донбассе, где стал командиром боевой дружины анархистов. За активное участие в революционных событиях был уволен с работы. В 1912–1917 годах проживал за границей — в Дании, Англии, Австралии и Аргентине. После Февральской революции вернулся в Россию и присоединился к анархистам. В муниципальных органах он был избран членом Севастопольского Совета депутатов."
 
 RGR_Konstantin_Monstrov: "Константин Монстров"
 RGR_Konstantin_Monstrov_DESC: "Константин Иванович Монстров — уроженец Симбирской губернии, проживавший в Сызрани. До революции 1917 года переехал в Туркестан, работал конторским служащим и подрядчиком, а с 1914 года владел крупным земельным участком в Ферганской долине. Во время гражданской войны, развернувшейся в Туркестане при большевиках, его избрали командующим Крестьянской армией русских поселенцев, проживающих в Ферганской долине. Крестьянская армия защищала поселенцев от набегов басмачей."
 
 RGR_Mahmood_bek: "Шир Мухаммед-бек Гази"
 RGR_Mahmood_bek_DESC: "Шир Мухаммед-бек Гази — в детстве перенёс глазную болезнь, из-за чего носил темные очки. Летом 1917 года во время демонстраций его братья и друзья были вынуждены скрываться. Позднее Махмуд-бек стал лидером узбекского и туркменского басмачества в Центральной Азии — курбаши, сумевшим превратить басмачество в политическую силу и добиться крупных успехов в борьбе с советской властью; он получил официальную поддержку Кабула и затем действовал на севере Афганистана."
 
 RGR_Pavel_Blagodatenko: "Павел Благодаренко"
 RGR_Pavel_Blagodatenko_DESC: "Павел Дмитриевич Благодаренко — родился в 1887 году в Воронежской губернии. По происхождению крестьянин, образование получил низшее. До политических событий работал садовником, в частности в санатории «Карасан». Во время Первой мировой войны служил в Русской армии. В революционный период присоединился к левым эсерaм. В селе Беловодско стал заметной фигурой в местной эсеровской организации. После чего начал активную антиреволюционную деятельность."
 
