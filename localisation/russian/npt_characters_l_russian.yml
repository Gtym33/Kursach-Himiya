 SOV_Sergey_Burov: "Сергей Буров"
 SOV_Mina_Aristov: "Мина Аристов"
 SOV_Mina_Aristov_desc: "Аристов Мина Львович, 1887 года рождения. Астраханский казак, революционер, член РСДРП(б) с 1905 года, участник Мировой войны. После большевистской революции — председатель Астраханского ВРК."
 SOV_Samuel_Zwilling: "Самуил Цвиллинг"
 SOV_Samuel_Zwilling_desc: "Цвиллинг Самуил Моисеевич, 1891 года рождения. Еврей-революционер низкого происхождения, революционер и член РСДРП(б) с 1905 года. Активно участвовал в большевистской революции в Петрограде, после возвращения на Южный Урал руководил установлением советской власти в регионе, развернул вооруженную борьбу против Дутова."
 SOV_Nikolay_Kashirin: "Николай Каширин"
 SOV_Nikolay_Kashirin_desc: "Каширин Николай Дмитриевич , 1888 года рождения. Оренбургский казак, участник Мировой войны, подъесаул. В 1917 году, после большевистской революции возглавил отряд красной гвардии Оренбурга. Один из лидеров революционного казачества Южного Урала."
 SOV_Konstantin_Akashev: "Константин Акашев"
 Konstantin_Akashev_air_chief: "Константин Акашев"
 SOV_Anton_Slutskiy: "Антон Слуцкий"
 SOV_Anton_Slutskiy_desc: "Антон Слуцкий, 1884 года рождения. Из евреев, в революционном движении с 1905 года, после падения монархии – заводской агитатор РСДРП(б). Член Всероссийского и Украинского ЦИК партии. После большевистской революции прибыл в Крым, где возглавил местных большевиков."
 
 DON_Alexey_Kaledin: "Алексей Каледин"
 DON_Alexey_Kaledin_DESC: "Каледин Алексей Максимович, 1861 года рождения. Из дворян, потомственный военный, генерал от кавалерии, участник Мировой войны, первый выборный атаман Всевеликого войска Донского за 200 лет, член военного совета. После большевистской революции организовал вооруженное сопротивление на Дону, возглавив Донское войсковое правительство."
 Alexey_Kaledin_1: "Алексей Каледин"
 Alexey_Kaledin_dead: "Мёртв"
 Alexey_Kaledin_political_advisor: "Алексей Каледин"
 DON_Pyotr_Krasnov: "Пётр Краснов"
 DON_Pyotr_Krasnov_DESC: "Краснов Пётр Николаевич, 1869 года рождения. Из дворян, потомственный военный, генерал-майор, участник Мировой войны, сторонник независимого казачьего государства, писатель. После большевистской революции возглавил вместе с А. Ф. Керенским неудачное наступление казачьих отрядов на Петроград. В начале 1918 года на Дону, где активно поддержал общедонское казачье восстание. Сторонник прогерманской ориентации. В казачьей среде пользуется большим авторитетом как отличившийся в боях с большевиками. Высказывает неопределённые идеи о независимой роли казачества, но обвинения в сепаратизме отрицает."
 Pyotr_Krasnov_1: "Пётр Краснов"
 Pyotr_Krasnov_dead: "Мёртв"
 Pyotr_Krasnov_political_advisor: "Пётр Краснов"
 
 DON_Alexandr_Sannikov: "Александр Санников"

 BKL_Grigoriy_Semyonov: "Григорий Семёнов"
 BKL_Grigoriy_Semyonov_duke: "Григорий I Семёнов"
 BKL_Grigoriy_Semyonov_Khan_I: "Григорий Хан I"
 BKL_Grigoriy_Semyonov_DESC: "Семёнов Григорий Михайлович, 1890 года рождения. Из забайкальских казаков, есаул. Герой Мировой войны, воевал в Царстве Польском, в Персии и на Кавказе. После падения монархии выдвинул идею создать добровольческий монголо-бурятский конный полк. Был назначен комиссаром Временного правительства и командирован с этой целью в Забайкалье. После захвата власти большевиками увел свой отряд на КВЖД, откуда начал вооруженную борьбу против местных красных сил. Лично храбрый человек, популярный среди казаков, он, однако, известен своей жестокостью и неразборчивостью в средствах. Пользуется поддержкой Японии."
 BKL_Roman_Fyodorovich_von_Ungern-Sternberg: "Роман Фёдорович фон Унгерн-Штернберг"
 BKL_Roman_Fyodorovich_von_Ungern-Sternberg_DESC: "Барон Николай Роман Макс (Роман Фёдорович) фон Унгерн-Штернберг, 1885 года рождения. Происходит из древнего остзейского баронского рода, есаул. Герой Мировой войны, воевал в Галиции, Восточной Пруссии и на Кавказе. Организовывал добровольческие отряды ассирийцев, затем отправился вместе с Г. Семёновым в Забайкалье формировать добровольческий монголо-бурятский полк. После большевистской революции вместе с Г. Семёновым ушел на КВЖД и вступил в вооруженную борьбу против местных красных сил. Лично храбрый человек, он известен своим буйным нравом, любовью к эзотерическим идеям и авантюрам. Характер скверный."
 
 OCH_Timofey_Sedelnikov: "Тимофей Седельников"
 OCH_Alexandr_Myakutin: "Александр Мякутин"
 OCH_Alexandr_Myakutin_desc: "Мякутин Александр Иванович, 1876 года рождения. Сын казацкого полковника, военный юрист, известный фольклорист, полковник, член Всероссийского учредительного собрания, близкий по своим взглядам к ПСР, после 1917 года принимал активное участие в политической жизни Оренбургского казачьего войска. После большевистской революции прибыл в область Оренбургского Казачьего Войска, был избран депутатом войскового круга, затем помощником атамана Дутова."
 OCH_Alexandr_Dutov: "Александр Дутов"
 OCH_Alexandr_Dutov_desc: "Дутов Александр Ильич, 1879 года рождения. Сын казацкого генерал-майора, добровольный участник Русско-японской и Мировой войн, на момент окончания службы в РИА — войсковой старшина (подполковник). После революции — активный казачий политический деятель, республиканец неопределённых взглядов. За несколько революционных месяцев из обычного офицера стал избранным атаманом Оренбургского казачьего войска."
 Alexandr_Dutov_1: "Александр Дутов"
 Alexandr_Dutov_army_chief: "Александр Дутов"
 Alexandr_Dutov_dead: "Мёртв"
 Alexandr_Dutov_dismissed: "Уволен"
 Alexandr_Dutov_is_here: "Здесь"
 OCH_Ivan_Akulinin: "Иван Акулинин"
 OCH_Ivan_Akulinin_desc: "Акулинин Иван Григорьевич, 1880 года рождения. Оренбургский казак, фольклорист, выпускник академии Генерального штаба, участник Русско-японской и Мировой войн, на момент окончания службы в РИА — полковник. Один из виднейших политических и военных деятелей Оренбургского казачества в Гражданскую войну."
 Ivan_Akulinin_1: "Иван Акулинин"
 Ivan_Akulinin_high_command: "Иван Акулинин"
 Ivan_Akulinin_dead: "Мёртв"
 Ivan_Akulinin_dismissed: "Уволен"
 Ivan_Akulinin_is_here: "Здесь"
 OCH_Nikolay_Anisimov: "Николай Анисимов"
 OCH_Nikolay_Anisimov_desc: "Анисимов Николай Семёнович, 1877 года рождения. Оренбургский казак, полковник, участник Русско-японской и Мировой войны. В 1917 году член Временного казачьего комитета, был избран депутатом Первого Войскового круга и членом военной комиссии."
 OCH_Kirill_Kargin: "Кирилл Каргин"
 OCH_Kirill_Kargin_desc: "Каргин Кирилл Леонтьевич, 1885 (по другим данным 1887) года рождения. Оренбургский казак, военный агроном, полковник, казачий войсковой атаман. После большевистской революции занял пост атамана первого военного отдельного Оренбургского казачьего войска. Стоял на либеральных позициях"
 
 OCH_Nikolay_Sukin: "Николай Сукин"
 OCH_Nikolay_Sukin_desc: "Сукин Николай Тимофеевич, 1878 года рождения. Оренбургский казак, выпускник академии Генерального штаба, на момент окончания службы в РИА — полковник. Один из виднейших политических и военных деятелей Оренбургского казачества в Гражданскую войну."
 OCH_Leonid_Timashev: "Леонид Тимашев"
 OCH_Alexandr_Vagin: "Александр Вагин"
 OCH_Gervasiy_Zhukov: "Гервасий Жуков"
 
 OCH_Timofey_Sedelnikov_desc: "Седельников Тимофей Иванович, 1876 года рождения. Политический деятель умеренно-левых взглядов, трудовик, член Государственной думы Российской империи I созыва от Оренбургской губернии. Выборный член Войскового круга Оренбургского Казачьего Войска, возглавлял левое крыло круга."



