l_russian:

rcw_fareasresp.1.t: "Дальневосточные добровольцы"
rcw_fareasresp.1.desc: "Длительное время честные русские люди Дальнего Востока ожидали возможности взять в руки оружие и освободить край от большевиков. Многие уповали на Союзников, чьи корабли то и дело заходили в порты Приморья. Увы, кроме демаршей Японии они не увидели ничего. Теперь, офицеры, юнкера, казаки и просто патриоты решили пробираться к нам. Некоторые идут организовано, кто-то сам по себе. Тем не менее, теперь они знают, что другой надежды на восстановления порядка нет."
rcw_fareasresp.1.a: "Добро пожаловать, братья"
