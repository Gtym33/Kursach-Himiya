 italy.1.t: "Паоло Бозелли подаёт в отставку"
 italy.1.d: "Паоло Бозелли — итальянский политик и государственный деятель. Бозелли поддерживал вступление Италии в Великую войну, и после ряда военных неудач Антонио Саландра 18 июня 1916 года занял пост премьер-министра в возрасте 78 лет. Однако Бозелли оказался не слишком способным правителем военного времени: наблюдались массовые проблемы в стране, и он был вынужден уйти в отставку. На формирование нового коалиционного кабинета будет приглашён Орландо."
 italy.1.a: "По крайней мере он ведь пытался?"
 italy.2.t: "Отставка Витторио Орландо"
 italy.2.d: "В октябре 1917 года поражение итальянской армии под Капоретто привело к отставке премьер-министра Паоло Бозелли, и Орландо был приглашён сформировать новый коалиционный кабинет.\n\nПосле победы Италии и её союзников Орландо представлял страну на Парижской мирной конференции в 1919 году как одного из лидеров «Большой четверки», однако его незнание английского языка поставило Орландо в зависимость от своего министра иностранных дел Сиднея Соннино.\n\nКроме того, требования Орландо присоединить Далмацию к Италии встретили сопротивление со стороны Соннино и президента США Вудро Вильсона, поддержавшего право народов Австро-Венгрии на самоопределение. В [GetDateText] года, за несколько недель до подписания договора, Орландо ушёл в отставку после провала переговоров о присоединении Фиуме к Италии."
 italy.2.de: "В октябре 1917 года поражение итальянской армии под Капоретто привело к отставке премьер-министра Паоло Бозелли, и Орландо был приглашён сформировать новый коалиционный кабинет.\n\nНо после поражением Италии и её союзников Орландо представлял в 1919 году страну на переговорах как одну из стран-победителей, однако его незнание английского языка поставило Орландо в зависимость от своего министра иностранных дел Сиднея Соннино. Кроме того, требования Австро-Венгрии о передаче территорий встретили сопротивление со стороны Соннино и дипломатa Австро-Венгрии, нежелавшего отдавать крупные территории.\n\nВ [GetDateText] года, за несколько недель до подписания договора, Орландо ушёл в отставку после провала переговоров."
 italy.2.a: "Неприятные вести"
 italy.3.t: "Смена Премьер-министра"
 italy.3.d: "В июне 1919 года Нитти был назначен новым премьер-министром Италии. В новом кабинете стал также министром внутренних дел.\n\nВо время премьерства Нитти в Италии были большие социальные волнения в результате подписания им Версальского договора, которым немало итальянцев были крайне недовольны. В результате [GetDateText] года место премьера уже в пятый раз будет занят Джованни Джолитти."
 italy.3.de: "В июне 1919 года Нитти был назначен новым премьер-министром Италии. В новом кабинете стал также министром внутренних дел.\n\nВо время премьерства Нитти в Италии были большие социальные волнения в результате подписания им унизительного договора с центральными державами, которым немало итальянцев были крайне недовольны. В результате [GetDateText] года место премьера уже в пятый раз будет занят Джованни Джолитти."
 italy.3.a: "Ситуация нестабильна"
 italy.4.t: "Парламентские выборы"
 italy.4.d: "Из-за Великой войны очередные всеобщие парламентские выборы в Италии были отложены и состоялись лишь шесть лет спустя. На них гражданам предстояло избрать 508 членов Палаты депутатов Королевства. Военные неудачи в противостоянии с Австро-Венгрией, обнажившие неготовность итальянской армии, а также глубокое разочарование общества итогами войны спровоцировали резкое падение доверия к правящим кругам. В результате праволиберальная коалиция, состоявшая из партий «Левая» и «Правая» и долгие годы доминировавшая на политической арене, потерпела сокрушительное поражение. Она не просто лишилась большинства в Палате депутатов, но и опустилась на пятое место по числу мандатов. Главными же политическими силами в стране стали Итальянская социалистическая партия, Итальянская народная (предшественница Христианско-демократической) и коалиция «Либералов, демократов и радикалов».\n\nКакой же из этих трех сил, имеющих равные шансы на лидерство, суждено определить дальнейший курс Италии?"
 italy.4.a: "Ни одна из партий не добилась большинства"
 italy.4.b: "Социалисты собирают большинство"
 italy.4.c: "Христианские демократы вырываются вперёд"
 italy.4.e: "Демократы лидируют"
 italy.5.t: "Новые парламентские выборы"
 italy.5.d: "Досрочные всеобщие парламентские выборы 1921 года вновь должны были определить будущее итальянской политики. Обстановка послевоенного времени оставляла желать лучшего: итальянское общество, ежедневно расшатываемое радикальными силами, по-прежнему страдало от множества нерешенных проблем и глубоких внутренних противоречий.\n\nОдной из таких деструктивных сил стал новосозданный «Национальный блок». Он объединил в своих рядах часть либералов — сторонников премьер-министра Джованни Джолитти, фашистов Бенито Муссолини и националистов Энрико Коррадини.\n\nЧто касается старейших политических объединений, то Итальянская социалистическая партия, ослабленная недавним расколом и выходом левого крыла (основавшего Коммунистическую партию Италии), потеряла пятую часть своих депутатских мандатов. В то же время католическая Итальянская народная партия, напротив, сумела укрепить позиции и значительно увеличить свое представительство в Палате депутатов."
 italy.5.a: "Ни одна из партий не добилась большинства"
 italy.5.b: "Социалисты собирают большинство"
 italy.5.c: "Христианские демократы вырываются вперёд"
 italy.5.e: "Национальный блок триумфально лидируют"
 italy.6.t: "Очередная отставка"
 italy.6.d: "Главной причиной ухода премьер-министра [ITA.GetLeader] в отставку стал крах его политической стратегии на досрочных выборах в мае 1921 года, который привел к потере устойчивого парламентского большинства. Курс старого либерала не позволил удержать баланс сил в условиях глубокого послевоенного кризиса, охватившего страну.\n\nВ сложившейся ситуации у главы кабинета фактически не оставалось иного выхода, кроме как сложить полномочия и передать власть коалиционному правительству социал-реформистов во главе с Иваноэ Бономи"
 italy.6.a: "И вновь министры меняются."
 italy.7.t: "Раскол среди коммунистов"
 italy.7.d: "[GetDateText] года на XVII съезде Итальянской социалистической партии в Ливорно произошло неизбежное: давний раскол в рядах левых сил завершился окончательным разрывом. Радикальное крыло объявило о своем выходе из ИСП, чтобы провозгласить создание новой политической силы — Коммунистической партии Италии.\n\nУ руля этого решительного откола встали непримиримые лидеры, готовые направить рабочее движение по пути революционного Октября. Генеральным секретарем новорожденной партии избран Амадео Бордига, и Антонио Грамши, возглавляющий боевую радикальную группу «Ордине Нуово» в промышленном Турине. Социалисты потеряли былое единство, и теперь судьба страны будет решаться в жестком противостоянии между крепнущими коммунистами и поднимающими голову правыми радикалами."
 italy.7.a: "Левые вновь грызутся"
 italy.8.t: "Формирование союза борьбы"
 italy.8.d: "Новая созданная организация, которая зовется «Итальянский союз борьбы» была сформирована Бенито Муссолини, взяв за основу еще прежний «Союз революционного действия», который существовал года с четырнадцатого.\n\nОтличительные черты их формы таковы: они носят черные рубашки, а на запястьях у них желтые и красные полоски в цвет римского флага. Своим символом они выбрали фасции — древнеримский знак власти, хотя для многих из нас это все еще традиционный республиканский символ. Главное, чем они сейчас занимаются и к чему стремятся — это жесткая, порой жестокая борьба с коммунистами и постоянными забастовками, которые парализовали наши заводы."
 italy.8.a: "Возможные союзники или будущие враги?"
 italy.9.t: "Создание Либеральной партии"
 italy.9.d: "Почти полвека, с марта 1861 года и вплоть до лета 1919 года, Совет министров Италии неизменно возглавляли представители «Левой» или «Правой» партий. Несмотря на политическую конкуренцию и программные различия, умеренное крыло обоих лагерей нередко находило почву для сотрудничества.\n\nОднако в первые два десятилетия XX века социально-политическая ситуация в стране резко обострилась. Стремительный рост рабочего класса, тяготы Первой мировой войны и глубокий послевоенный экономический кризис нанесли сокрушительный удар по популярности правоцентристских сил. В результате парламентские выборы 1919 года обернулись для правящей праволиберальной коалиции полным разгромом. Она не просто лишилась абсолютного большинства, но и опустилась на пятое место по числу депутатских мандатов. Чтобы спасти положение и сплотить уцелевшие силы, остатки «Правой» и «Левой» объединились, создав 8 октября 1922 года Итальянскую либеральную партию.\n\nТяжелейший кризис, последовавший за выборами 1919 года, вызвал мощный подъем левых настроений в обществе. Страх перед возможным коммунистическим переворотом сковал традиционную элиту. Именно эта паника привела к тому, что политический истеблишмент начала 1920-х годов сознательно закрывал глаза на растущую агрессию и фашистские лозунги Бенито Муссолини, видя в его чернорубашечниках удобный инструмент для подавления социалистов."
 italy.9.a: "Многолетнее господство лидирующих партий рушится на глазах"
 italy.10.t: "Иваноэ Бономи складывает полномочия"
 italy.10.d: "Сформированная Иваноэ Бономи коалиция держалась на хрупком союзе центристов-либералов, реформистов и католической Народной партии. Из-за глубоких идеологических разногласий внутри кабинета министры оказались парализованы и не могли согласовать ни один серьезный законопроект.\n\nСитуацию в стране усугублял разгул радикализма: по всей Италии фашистские боевые отряды (сквадристы) безнаказанно громили рабочие профсоюзы, левые типографии и захватывали городские администрации. Бономи отчаянно пытался умиротворить радикалов и даже способствовал заключению «пакта умиротворения» между фашистами и социалистами, однако Муссолини быстро сорвал эти договоренности.\n\nПолитический тупик и разгул насилия на улицах привели к закономерному финалу. Не найдя поддержки, Иваноэ Бономи, вошедший в историю как первый социалист, возглавивший итальянское правительство, был вынужден подать в отставку."
 italy.10.a: "Италия рушится на глазах"
 italy.11.t: "Подъем фашизма"
 italy.11.d: "В марте 1919 года Бенито Муссолини основал в Милане «Итальянский союз борьбы», чьи местные отделения вскоре начали открываться во многих городах страны. На тот момент Муссолини еще придерживался некоторых левых взглядов, что, однако, не мешало фашистам ожесточенно враждовать с социалистами. Обе стороны активно создавали собственные военизированные группировки, и Италия погрузилась в череду уличных стычек, регулярно приводивших к ранениям и гибели людей.\n\nНа всеобщих выборах в мае 1921 года Муссолини пошел на тактический шаг, заключив соглашение о создании «Национального блока» с либералами премьер-министра Джованни Джолитти и Итальянской националистической ассоциацией Энрико Коррадини. Этот союз принес радикалам успех: тридцать пять фашистских депутатов во главе со своим лидером триумфально прошли в Палату депутатов итальянского парламента.\n\nЗакрепляя политический успех, в ноябре того же года соратники Муссолини собрались на свой III съезд. В ходе этой исторической встречи «Итальянский союз борьбы» был официально преобразован в полноценную и жестко структурированную Национальную фашистскую партию."
 italy.11.a: "Фашисты начинают представлять серьёзную угрозу"
 italy.12.t: "Экономика после войны"
 italy.12.d: "Военные заказы стимулировали стремительный рост ключевых отраслей тяжелой индустрии, принеся огромные прибыли контролировавшим их корпорациям. За годы Первой мировой войны капиталы крупнейших итальянских трестов возросли многократно. В результате форсированного развития тяжелой промышленности Италия превратилась из сугубо аграрной страны в аграрно-индустриальную.\n\nОднако этот неравномерный скачок лишь усугубил диспропорции, изначально свойственные итальянской экономике. Искусственный подъем военных лет затронул легкую промышленность лишь в той мере, в какой она была задействована в военном производстве. В то же время ее «гражданские» отрасли в условиях тотальной милитаризации прозябали или вовсе сворачивались.\n\nСерьезный удар был нанесен и по аграрному сектору. Сельское хозяйство, лишившееся из-за мобилизации значительной части наиболее трудоспособных работников, оказалось полностью подорвано. Если в предвоенные годы Италия выступала преимущественно как экспортер продовольствия, то в послевоенный период она была вынуждена его импортировать."
 italy.12.a: "Мы сами довели экономику до такого..."
 italy.13.t: "Начало «Красного двухлетия»"
 italy.13.d: "В условиях послевоенной разрухи не только рабочий класс, но и другие слои населения ощутили острейшую потребность в защите своего жизненного уровня. Под руководством профсоюзов в стране развернулось невиданное по масштабам стачечное движение. В 1919 году число его участников перевалило за один миллион человек, что почти втрое превзошло рекордный для довоенного периода показатель 1913 года. Одновременно с этим повсеместно проходили массовые выступления граждан против дороговизны жизни.\n\nПротесты быстро охватили и аграрный сектор. В районах капиталистического сельского хозяйства, особенно в долине реки По, батраки требовали от землевладельцев официального признания своих организаций, права на регулирование условий найма и соблюдения четких норм использования рабочей силы. В то же время на Юге, в зоне латифундий, крестьяне перешли к прямым действиям и начали массово занимать помещичьи земли.\n\nВсе эти разнородные движения несли в себе мощный заряд антикапиталистических настроений. Рабочие и крестьяне активно вступали в борьбу, добиваясь отрезвления элит и компенсации за тяжелые лишения и страдания военных лет. Подобные требования неизбежно придавали экономическим выступлениям трудящихся отчетливый политический оттенок. К тому же в развернувшихся классовых битвах..."
 italy.13.a: "Будем следить за предстоящим"
 italy.13.b: "Следует идти с ними на контакт"
 italy.14.t: "Инцидент на заводе «ФИАТ—Линготто»"
 italy.14.d: "Активную роль в коммунистическом движении играли фабрично-заводские советы. Над захваченными предприятиями развевались красные флаги, там же было оперативно налажено изготовление оружия и началось формирование отрядов Красной гвардии. Примечательно, что с протестующими рабочими солидаризировалась и часть технических специалистов. Все занятые объекты бдительно охранялись: люди были полностью готовы к вооруженному отпору на случай, если правительственные силы попытаются выбить их оттуда.\n\nНаглядное свидетельство тех тревожных дней оставил участник событий Марио Монтаньяна. Он вспоминал, как однажды ночью от красногвардейских патрулей поступило экстренное сообщение: к туринскому заводу «ФИАТ—Линготто» с разных сторон начали стягиваться регулярные войска и отряды королевской гвардии.\n\nПо воспоминаниям очевидца, в то же мгновение по тревожному звуку заводского гудка все станки остановились. Из цехов и дверей огромного промышленного комплекса стали выбегать сотни рабочих в комбинезонах, с лицами, покрытыми пылью и машинным маслом. Почти каждый из них был вооружен — от револьверов и гранат до винтовок. Те же, кому не досталось огнестрельного оружия, держали в руках огромные железные копья, собственноручно откованные и наточенные в заводских мастерских. Эти люди были полны решимости отдать свои жизни, защищая собственное предприятие."
 italy.14.a: "На что ещё они готовы ради борьбы?"
 italy.15.t: "Последствие инцидента"
 italy.15.d: "Когда рабочие перешли к массовым захватам заводов, а над промышленными комплексами вроде туринского «ФИАТ—Линготто» поднялись красные флаги и сформировались вооруженные отряды Красной гвардии, крупный бизнес охватила паника.\n\nКрайне напуганные предприниматели возлагали все свои надежды на многоопытного [ITA.GetLeader], который возглавил правительство страны. Опасаясь полномасштабной социалистической революции, некоторые представители промышленных кругов требовали от премьер-министра самых решительных мер, вплоть до применения против восставших артиллерии.\n\nОднако искушенный в компромиссах [ITA.GetLeader] прекрасно понимал, что силовое подавление миллионного стачечного движения может спровоцировать кровопролитную гражданскую войну. Историки утверждают, что автору предложения применить пушки премьер ответил с тонкой иронией: «Хорошо, если Вы не возражаете, я начну с обстрела Вашего завода». После этого промышленники больше не настаивали на радикальных мерах, а глава кабинета предпочел тактику выжидания, рассчитывая, что революционный запал рабочих со временем иссякнет сам по себе."
 italy.15.a: "Не следует переходить к кровопролитию"
 italy.15.b: "Бунтовщики должны быть наказаны"
 italy.16.t: "Конфликт с рабочими «ФИАТ—Линготто» исчерпан"
 italy.16.d: "Расчет [ITA.GetLeader] оказался верным. ИСП, парализованная внутренними разногласиями, устранилась от руководства уже развернувшимся массовым движением и не предложила ему какой бы то ни было перспективы дальнейших действий, что неминуемо должно было привести к его спаду. По инициативе [ITA.GetLeader] и при его посредничестве были начаты переговоры представителей профсоюзов с конфедерацией промышленников, и в обмен на обещание правительства ввести закон о рабочем контроле занятие предприятий было прекращено."
 italy.16.a: "Победа дипломатии"
 italy.17.t: "Фашистское действо"
 italy.17.d: "С изменением соотношения сил на политической арене отчетливо проявилась глубинная контрреволюционная, антипролетарская и антидемократическая суть фашизма. Начиная с конца 1920 года Северную и Центральную Италию захлестнула волна фашистского террора. Чернорубашечники поджигали штаб-квартиры рабочих организаций, жестоко избивали и убивали левых активистов, а также силой разгоняли «красные» муниципалитеты. В своей пропаганде они искусно создавали образ единственных спасителей страны от «большевистской угрозы». Ключевое место в их риторике заняла идея сильного, тоталитарного государства, способного железной рукой покончить с анархией и навсегда исключить ее повторение.\n\nПодобный курс полностью отвечал интересам напуганной итальянской буржуазии, с трудом удержавшей власть в годы рабочих волнений. В лице фашистов крупные промышленники и землевладельцы обрели не просто эффективное орудие для силового подавления рабочего класса, но и способ восстановить на этой почве политический союз с широкими мелкобуржуазными массами. Именно поэтому движение Бенито Муссолини стало получать все более мощную финансовую и политическую поддержку со стороны правящих кругов страны."
 italy.17.a: "С ними нужно быть начеку"
 italy.18.t: "Надвигающаяся катастрофа"
 italy.18.d: "Во время правительственного кризиса в июле 1922 года реформисты выразили готовность войти в состав кабинета министров совместно с либералами и представителями католической Народной партии. Они рассчитывали, что подобный шаг позволит остановить продвижение фашистов к власти. 1 августа подконтрольный реформистам «Союз труда» объявил общенациональную забастовку, получившую название «в защиту закона». Ее главной целью было принуждение политических сил к формированию правительства, способного защитить гражданские свободы и законность, которые повсеместно попирались фашистами.\n\nОднако буржуазные партии отвергли предложенное реформистами сотрудничество. Сама забастовка, которой фашисты противопоставили угрожающую мобилизацию собственных сил, во многих регионах быстро вышла за мирные рамки. Так, в Парме рабочие в ходе ожесточенных баррикадных боев одержали победу над вооруженными отрядами чернорубашечников и полностью изгнали их из города. Подобный радикальный поворот событий не входил в планы реформистского руководства. Как только Луиджи Факта сформировал свое второе правительство, оказавшееся еще более правым по своему составу, «Союз труда» поспешил прекратить забастовку, а вскоре после этого и вовсе распался.\n\nНастойчивый курс реформистов на компромисс с буржуазными партиями обострил внутренние противоречия в Итальянской социалистической партии (ИСП) и привел к ее официальному расколу. Исключенные из ИСП реформисты образовали Унитарную социалистическую партию (УСП). Если бы это разделение произошло раньше, каждое из течений внутри левого лагеря получило бы возможность действовать более свободно, сообразно собственной политической линии. Однако в сложившихся условиях раскол лишь усугубил разобщенность и без того ослабленного итальянского рабочего движения."
 italy.18.a: "Информируйте о новых событиях и дальше."
 italy.19.t: "Марш на Рим"
 italy.19.d: "Теперь уже ничто не препятствовало фашистам в осуществлении их планов. В конце октября 1922 года съезд Национальной фашистской партии в Неаполе предъявил действующей власти ультимативные требования о предоставлении их представителям ключевых министерских постов. Одновременно с этим была объявлена всеобщая мобилизация фашистских дружин (сквадристов), которые начали подготовку к походу на Рим.\n\nВ условиях паралича государственной власти правительство готовиться подать в отставку."
 italy.19.a: "Теперь, для нас уже всё кончено"
 italy.19.b: "Дальше они не пройдут!"
