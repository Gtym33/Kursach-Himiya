l_russian:
 ITA_incompetent_command: "Неопытные офицеры"
 ITA_antiwar_strikes: "Забастовки рабочих"
 ITA_weak_military_industry: "Плохое снабжение армии"
 ITA_Italian_army: "Итальянская армия"
 ITA_Italian_army_desc: "Уже в первый год войны в войсках остро ощущалась нехватка вооружения и зимнего обмундирования. Боеспособность войск по-прежнему оставалась низкой. Массовые волнения и низкий уровень организации армии делали ведение войны непосильной задачей."
 ITA_Militarized_industry: "Милитаризированная нация"
 ITA_Militarized_industry_desc: "Экономические последствия войны Италия ощутила ещё до своего вступления в неё. Вызванный войной разрыв торговых связей нанёс ущерб итальянской промышленности, из-за чего многие предприятия закрылись. Вступление Италии в войну, напротив, повлекло за собой ускоренное развитие отраслей промышленности, связанных с военными поставками, при одновременном свёртывании сугубо гражданского производства. Сельское хозяйство было обескровлено массовой мобилизацией крестьян, а поголовная безработица и бедность никуда не исчезли."
 ITA_Vittorio_Emanuele_III_idea: "Виктор Эммануил III"
 ITA_defeated_among_the_victors: "Побеждённая среди победительниц"
 ITA_defeated_among_the_victors_desc: "Обширным экспансионистским планам, с которыми Италия вступила в войну на стороне Антанты, не суждено было осуществиться. Попав ещё в ходе боевых действий в сильную военно-политическую и финансовую зависимость от союзников, страна не имела реальных возможностей добиться выполнения своих требований. В итоге союзные державы не удовлетворили притязания Рима в полной мере, оставив Италию обременённой огромными долгами и тяжелыми потерями, но без существенных территориальных приобретений."
 ITA_Postwar_economy: "Послевоенная экономика"
 ITA_Postwar_economy_desc: "Многолетняя война что охватило Италию, нанесло серьёзный урон по экономике. Переоборудованные гражданские заводы на военный лад, позволили увеличить оборонную силу королевства, но тем самым погубило предприятия под гражданские нужды. Серьезный удар был нанесен и по аграрному сектору. Сельское хозяйство, лишившееся из-за мобилизации значительной части наиболее трудоспособных работников, оказалось полностью подорвано."
 ITA_Communist_upsurge: "Коммунистический подъем"
 ITA_Communist_upsurge_desc: "В условиях послевоенной разрухи не только рабочий класс, но и другие слои населения ощутили острейшую потребность в защите своего жизненного уровня. Под руководством профсоюзов в стране развернулось невиданное по масштабам стачечное движение. Одновременно с этим повсеместно проходили массовые выступления граждан против дороговизны жизни."